<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings key screens v1</title>
<style>
/*
  Key screens v1 — Settings rework (late Discovery). Spine sections each frame illustrates:
  1  Settings top page at rest      — Information Architecture (top-page groups); Component Patterns: list row
  2  Top page scrolled, from gear   — Interaction Primitives: collapsing title; Information Architecture
  3  Dates list                     — Information Architecture (Dates); Component Patterns: list row
  4  Event page                     — Component Patterns: list row (tap to edit), switch row
  5  Notifications                  — Component Patterns: switch row; Information Architecture (Notifications)
  6  Notifications, permission off  — State Patterns: permission off
  7  One-field edit (Date)          — Component Patterns: one-field edit page
  Tokens are the light --kit-* values from src/index.css; sizes and radii from
  src/components/shared/kitClasses.ts (CARD, DIVIDER, GROUP_ROW, GROUP_TILE,
  SECTION_LABEL, NOTICE, ADD_BUTTON, fieldClass) and SwitchRow.tsx.
  Inter and Playfair Display are Google webfonts; offline the mock falls back
  to the system sans and a system serif.
*/
:root {
  --kit-page: #fdf4f7;
  --kit-card: #ffffff;
  --kit-card2: #f6eef2;
  --kit-ink: #1f2430;
  --kit-muted: #646b78;
  --kit-accent: #c8216b;
  --kit-fill: #db2777;
  --kit-tint: #fce7f3;
  --kit-danger: #cf2121;
  --kit-dtint: #fdecec;
  --kit-line: rgba(157, 23, 77, 0.09);
  --kit-line-strong: #987d90;
  --kit-glass: rgba(255, 255, 255, 0.8);
  --kit-field: #fbf7f9;
  --kit-shadow-card: 0 1px 2px rgba(157, 23, 77, 0.05), 0 8px 24px rgba(157, 23, 77, 0.06);
  --kit-shadow-float: 0 10px 30px rgba(157, 23, 77, 0.16);
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  --serif: 'Playfair Display', 'Iowan Old Style', Palatino, Georgia, serif;
  --canvas: #ebe9e7;
  --canvas-ink: #3b3f47;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--canvas);
  color: var(--canvas-ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  padding: 32px 16px 64px;
}
.sheet-head { max-width: 1400px; margin: 0 auto 28px; }
.sheet-head h1 { margin: 0 0 6px; font-size: 20px; font-weight: 600; }
.sheet-head p { margin: 0; font-size: 13px; line-height: 1.5; max-width: 760px; }
.board {
  display: flex; flex-wrap: wrap; gap: 40px 36px;
  justify-content: center; align-items: flex-start;
  max-width: 1400px; margin: 0 auto;
}
figure.shot { margin: 0; width: 410px; max-width: 100%; }
figcaption { margin-top: 12px; font-size: 13px; line-height: 1.5; padding: 0 6px; }
figcaption b { font-weight: 600; }
.tag {
  display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: .04em;
  text-transform: uppercase; color: #8a5a00; background: #fbecc8; border-radius: 6px;
  padding: 1px 6px; margin: 0 2px; vertical-align: 1px;
}

/* Device frame */
.phone {
  border: 10px solid #1b1d22; border-radius: 54px; background: #1b1d22;
  box-shadow: 0 20px 50px rgba(0,0,0,.18);
}
.screen {
  position: relative; overflow: hidden; border-radius: 44px;
  background: var(--kit-page); color: var(--kit-ink);
  min-height: 844px; padding-bottom: 130px; /* --dock-clearance: 6rem + 34px home-indicator inset */
}
.screen.crop { min-height: 0; height: 560px; padding-bottom: 0; }
.screen.crop::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 90px;
  background: linear-gradient(to bottom, rgba(253,244,247,0), var(--kit-page));
}
.status {
  height: 47px; display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 30px 8px 36px; font-size: 16px; font-weight: 600; color: var(--kit-ink);
  position: relative; z-index: 3;
}
.status .icons { display: flex; gap: 6px; align-items: center; }
.home-ind {
  position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px;
  margin-left: -67px; border-radius: 3px; background: var(--kit-ink); z-index: 6;
}

/* Settings' own bar */
.toprow { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; }
.bar {
  height: 64px; display: grid; grid-template-columns: 64px 1fr 64px; align-items: center;
  padding: 0 8px; border-bottom: 1px solid var(--kit-line);
}
.bar-title { text-align: center; font-size: 17px; font-weight: 600; color: var(--kit-ink); }
.glass { background: var(--kit-glass); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.overlay-bar { position: absolute; top: 0; left: 0; right: 0; z-index: 2; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 999px; display: flex;
  align-items: center; justify-content: center; color: var(--kit-ink);
}
.icon-btn svg { width: 24px; height: 24px; }
.add-btn { background: var(--kit-tint); color: var(--kit-accent); justify-self: end; }
.add-btn svg { width: 20px; height: 20px; }
.save { justify-self: end; padding-right: 8px; font-size: 17px; font-weight: 600; color: var(--kit-accent); }
.large-title {
  margin: 0; padding: 0 20px 16px; font-family: var(--serif);
  font-size: 30px; line-height: 1.1; font-weight: 600; color: var(--kit-ink);
}

/* Page body */
.content { padding: 0 16px; display: flex; flex-direction: column; gap: 16px; }
.content.below-bar { padding-top: 16px; }
.section { display: flex; flex-direction: column; gap: 8px; }
.label { /* SECTION_LABEL */
  padding: 0 4px; font-size: 12px; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--kit-muted); margin: 0;
}
.card { /* CARD */
  display: flex; flex-direction: column; gap: 6px; padding: 12px;
  background: var(--kit-card); border: 1px solid var(--kit-line);
  border-radius: 20px; box-shadow: var(--kit-shadow-card);
}
.div { height: 1px; margin: 0 -12px; background: var(--kit-line); } /* DIVIDER */
.row { display: flex; align-items: center; gap: 12px; min-height: 48px; } /* GROUP_ROW */
.tile { /* GROUP_TILE */
  width: 36px; height: 36px; flex: none; border-radius: 12px;
  background: var(--kit-tint); color: var(--kit-accent);
  display: flex; align-items: center; justify-content: center;
}
.tile svg { width: 17px; height: 17px; }
.row .name { flex: 1; min-width: 0; font-size: 15px; font-weight: 500; color: var(--kit-ink); }
.row .value { font-size: 15px; color: var(--kit-muted); white-space: nowrap; }
.row .glyph { color: var(--kit-accent); display: flex; }
.row .glyph svg { width: 20px; height: 20px; }
.chev { width: 18px; height: 18px; flex: none; color: var(--kit-muted); margin-left: -4px; }
.row.danger .tile { background: var(--kit-dtint); color: var(--kit-danger); }
.row.danger .name { color: var(--kit-danger); }
.row.center { justify-content: center; }
.row.center .name { flex: none; color: var(--kit-danger); }
.foot { margin: 0; padding: 0 4px; font-size: 13px; line-height: 1.4; color: var(--kit-muted); }
.version { margin: 4px 0 0; text-align: center; font-size: 13px; color: var(--kit-muted); }
.notice { /* NOTICE */
  margin: 0; padding: 12px; border-radius: 14px; background: var(--kit-card2);
  font-size: 16px; line-height: 1.45; color: var(--kit-ink);
}
.dim { opacity: .6; } /* SwitchRow disabled */

/* SwitchRow track and thumb: h-7 w-12, thumb h-5 w-5, translate-x-6 when on */
.switch {
  position: relative; width: 48px; height: 28px; flex: none; border-radius: 999px;
  background: var(--kit-line-strong);
}
.switch::after {
  content: ''; position: absolute; top: 4px; left: 4px; width: 20px; height: 20px;
  border-radius: 999px; background: var(--kit-card);
  box-shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.1);
}
.switch.on { background: var(--kit-fill); }
.switch.on::after { left: 24px; }

/* One-field edit: fieldClass(false) */
.field {
  height: 48px; border-radius: 14px; background: var(--kit-field);
  box-shadow: inset 0 0 0 1px var(--kit-line-strong);
  display: flex; align-items: center; padding: 0 16px; font-size: 16px; color: var(--kit-ink);
}

/* Bottom dock (AppNavigation, bottom form) */
.dock {
  position: absolute; left: 16px; right: 16px; bottom: 50px; height: 60px; z-index: 5;
  display: flex; align-items: center; justify-content: space-between; padding: 0 8px;
  border-radius: 999px; background: var(--kit-glass);
  -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
  box-shadow: var(--kit-shadow-float), 0 0 0 1px var(--kit-line);
}
.dock span { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--kit-muted); }
.dock svg { width: 22px; height: 22px; }

svg.i { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

@media (max-width: 440px) {
  body { padding: 20px 0 48px; }
  .sheet-head { padding: 0 16px; }
  figure.shot { width: 100%; padding: 0 4px; }
  .phone { border-width: 6px; border-radius: 46px; }
}
</style>

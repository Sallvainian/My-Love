[[entry]]
id = 8
type = "story"
title = "Love notes stack apart and the badge counts unread notes"
description = "Every push carries a lock-screen group: love notes in one, everything else in another, and epic-date-reminders' story 4.6 puts reminders in that second group by its name. A new per-account marker records when the person last opened Love Notes, and every push carries the count of partner notes newer than it. Opening Love Notes writes the marker and clears the badge, and a note arriving while Love Notes is on screen counts as read; opening Love Notes on the website or the Home Screen web app writes the marker too, in the background, with nothing visible changed (R5, R11). With the app in the foreground, a push shows no banner and the badge still updates. Extends the sender and story 1's web-side push module. The lock-screen and badge checks run through story 2.9's driver and story 12's notification steps, with payloads the sender built delivered by xcrun simctl push, with no person."
verify = "Unit tests and the sender's deno tests cover the count, the marker and each payload's group; an E2E spec shows opening Love Notes on the website writes the marker, and the count the sender builds for the next note is 1. Through the driver on the simulator, a love note and a mood show as two Notification Center groups; two notes read badge 2, opening Love Notes clears it, and the next note reads 1; a note arriving with Love Notes open leaves the badge clear; a push arriving with the app in front on another view shows no banner and raises the badge."
covers = ["R4", "R5", "R8"]
after = [7]
hitl = false

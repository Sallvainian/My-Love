# The epic's stories in build order.

[[entry]]
id = 12
type = "story"
title = "The simulator driver reads and taps notifications"
description = "Extends story 2.9's simulator driver with notification steps, porting the prototype's Notify.swift, notify.sh and the host app's notification probes, and shown on the driver's own host app so no My Love push code is needed. Another session showed on the iPhone Duo simulator (iOS 27.1) a banner read, the badge read, a tap from a cold start and from the background, and two pushes on one thread shown as one Grouped cell; telling two groups apart by thread id and scrolling to older groups are new here. Steps: tap SpringBoard's Allow or Don't Allow on the permission alert, and reset the permission between runs; deliver a payload with xcrun simctl push; read a banner's text (NotificationShortLookView's label), which needs the watch started before the push is sent, because banners last seconds; read Notification Center's groups by thread id, after returning to Home before each drag from the top (a second drag while it is open lands on search) and scrolling to reach older groups; read the app icon badge from the icon's value ('3 new items'); and tap a notification to open the app from a cold start and from the background, putting another app in front first, since an XCUITest run leaves its target in front and an app in front shows no banner. Elements are queried by identifier across all types, because a banner is not .other. Hands stories 1, 2 and 4 to 9 the steps they check pushes with, and story 4.1 the permission step; story 4.7 extends the driver after it."
verify = "With no person acting, on the iPhone Duo simulator the driver grants permission through SpringBoard's alert, and after a reset declines it, reads a pushed banner's title and body, reads two pushes on one thread as one Notification Center group and a third on another thread as a second, reads the badge a push set, and opens the host app by tapping a banner from a cold start and from the background, each state confirmed through XCUIApplication.state."
covers = []
after = ["2.9", "2.4"]
hitl = false
risk = "high"

[[entry]]
id = 14
type = "story"
title = "The simulator driver reads Notification Center on the unfolded Duo in portrait"
description = "Story 12's sim center reads Notification Center's groups reliably only while they all fit on one screen: scrolling to older groups did not work, and the owner checked the 8-group case (threads A–H) by hand; on the iPhone Duo simulator unfolded and in portrait, all 8 fit on one screen (both owner, 2026-10-31). Story 12's center also refuses to run unless ax state reads pose: closed and orientation: portrait, exiting 1 with 'center needs the device folded and in portrait', because unfolded or rotated its drag from the top misses and Notification Center never opens (story 12's dev session, 2026-10-31); the owner opened Notification Center unfolded in portrait by hand, so it can be done. So a check of up to 8 groups needs no person: on the Duo, sim center records the pose and orientation ax state reports, unfolds with ax pose open, rotates with ax rotate until ax state reads portrait, reads, and then puts the pose and orientation back, also when the read fails. Folding can change the orientation (story 2.8 found pose closed left the Duo in landscapeRight), so after folding it rotates until ax state matches what it recorded. This story removes or replaces story 12's folded-and-portrait guard, and makes the drag from the top open Notification Center on the inner display in portrait. Story 2.7 found AXe coordinate taps reach the shell only in outer portrait, never the inner display, and story 2.9 proved XCUITest taps on the inner display only inside the web view, so this story also shows that XCUITest's taps reach SpringBoard on the inner display; if XCUITest cannot open Notification Center or tap SpringBoard on the inner display, the story stops and is re-sliced. sim help's center line no longer says 'Needs the device folded and in portrait.'; it says center unfolds the Duo to portrait and puts the pose back, and states the group count center was proven at. Builds on story 12's center step, comes before story 1 because both may change scripts/sim-driver/sim, and changes only scripts/sim-driver/ and the driver's clause in AGENTS.md."
verify = "With no person acting, on the iPhone Duo simulator with the host app authorized and one push delivered on each of threads A–H, each payload's title naming its thread, sim center --host started from folded portrait, from folded landscapeLeft, from folded landscapeRight and from unfolded landscape each prints eight groups, A to H each exactly once with one notification, none refused with 'center needs the device folded and in portrait', and ax state afterwards reads the pose and orientation it read before; a center run interrupted with SIGINT after it has unfolded also restores them; unfolded in portrait, sim banner FILE --host --tap cold and --tap background each bring the host app to runningForeground, showing an XCUITest tap reaches SpringBoard on the inner display; sim help's center line says center unfolds the Duo to portrait and puts the pose back, names the group count it was proven at, and no longer says it needs the device folded and in portrait."
covers = []
after = [12]
hitl = false
risk = "high"

[[entry]]
id = 1
type = "story"
title = "A love note pushes to the partner's iPhone"
description = "The thinnest path through every layer. The shell gains the push capability and, on the first signed-in launch of a shell with it, asks for notification permission once. It registers the device for the signed-in account in a new RLS-protected table, with the APNs environment its signing gives (sandbox for an Xcode development install, production otherwise), where a device registered again under another account moves to that account. iOS has one notification permission for pushes and local reminders, so epic-date-reminders reuses this prompt. A new sender Edge Function sends a love-note push through APNs with the sender's name and the note's text (a picture-only note says a picture was sent) to every device registered to the partner and none of the sender's. The sender runs from a database trigger on each newly inserted row, so a note queued offline pushes when it reaches the server and an insert ignored as a duplicate fires nothing; a failed or slow push never fails or delays the insert. Story 1 confirms the trigger works on the local stack; story 13 confirms it on the hosted project (the epic's Unknown). Web code calls the plugin only after Capacitor.isPluginAvailable. The Push capability is set in the Xcode project's code (the aps-environment entitlement). No APNs key exists until story 13: with no key set, the sender records the request it would have sent (device, environment, payload) where the driver can read it, so the simulator check delivers the payload that came through the trigger with xcrun simctl push; stories 2 and 4–9 reuse that record, and real APNs delivery is story 13's. Story 1 adds the sender's deno tests to test.yml beside upload-love-note-image's, so CI runs them, and the sender's [functions.<name>] section in supabase/config.toml, which has none today, so it runs on the local stack. The simulator checks run through story 2.9's driver and story 12's notification steps, against the local stack with story 2.9's fixture pair, with no person; stories 2 and 4–9 add any further fixture accounts they need (another pair, two unlinked accounts) the same way. Hands on: the device table, the sender and its payload builder (extended by stories 2, 4, 5, 6, 7 and 8, and deployed by story 3), the recorded request, the web-side push module (extended by stories 2, 7, 8 and 9), and the permission prompt (reused by epic-date-reminders)."
verify = "The sender's deno unit tests and an api-project spec for registration and the trigger pass, showing a love note's insert reaches the sender on the local stack, a retried send yields one push, a picture-only note's payload says a picture was sent, no push targets the sender's own devices, a failed or slow send neither fails nor delays the insert, and each registration records its APNs environment, which picks the APNs host the sender would call. Through story 2.9's driver, on the iPhone Duo simulator signed in as one fixture account against the local stack, the permission alert shows once across two launches, the device registers, and the payload the sender built for a note from the partner, delivered with xcrun simctl push, shows a banner with the sender's name and the text; a shell built before this epic (story 2.9's earlier-commit build) and updated to the new bundle by live update runs with no error."
covers = ["R1", "R7", "R9", "R11"]
after = [14]
hitl = false
risk = "high"

[[entry]]
id = 2
type = "story"
title = "Sign-out stops a device's pushes"
description = "deleteAccountData() runs after supabase.auth.signOut() has ended the session, so the server row cannot be removed there. Instead, sign-out removes the device's registration before the session ends, while still online, then unregisters the device from APNs natively and clears the app icon badge. A sign-out made offline, and a boot with no session that the my-love-account-owner marker sends to deleteAccountData(), still unregister natively and clear the badge, so no push shows. The sender deletes any registration APNs reports as gone, and a sign-in by another account takes the device's registration over. The next account receives only its own pushes. Apple discourages unregisterForRemoteNotifications, so re-registering after it, and the takeover stopping the previous account's pushes, are proven on a device in story 13. Extends story 1's web-side push module, device table and sender. The simulator checks run through story 2.9's driver and story 12's notification steps against story 2.9's fixture pair and another pair added the same way, with no person."
verify = "Unit tests show sign-out removes the registration before the session ends, and that sign-out, offline sign-out and the no-session boot unregister natively and clear the badge; a deno test shows the sender deletes a registration APNs reports as gone; through story 2.9's driver on the simulator, after signing out and signing in as an account from another fixture pair, the sender targets no device of the first account for a love note to it, the new account's note payload delivered with xcrun simctl push shows its banner, and the badge reads clear after sign-out."
covers = ["R10"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Every Edge Function deploys from deploy.yml"
description = "deploy.yml gets a job after migrate and before build that deploys every function in supabase/functions (upload-love-note-image and story 1's sender); build needs it, so a failed function deploy stops the site deploy. It adds upload-love-note-image's [functions] section to supabase/config.toml with verify_jwt = true, as the hosted project reports it, beside story 1's sender section. Before the first run, the builder reads each hosted function's settings read-only (JWT verification among them) and keeps them, so the automated deploy changes nothing that was set by hand. A person triggers the first run, because it deploys to production. Waits on story 1 so the first run deploys the sender; story 13 checks the deployed sender on the hosted project, and story 11 relies on it to ship to production."
verify = "A workflow_dispatch run of deploy.yml deploys every function before the site build, the Management API's function list (version and verify_jwt per function), read before the first run and again after it, shows each function at a new version with verify_jwt unchanged (supabase functions list prints no settings), and the workflow's needs: chain puts the functions job after migrate and before build."
covers = []
after = [1]
hitl = true
risk = "medium"

[[entry]]
id = 13
type = "story"
title = "Pushes arrive through APNs on a device and from the hosted project"
description = "The checks no simulator can make without a person, run before the remaining push types build on the sender. A person creates the APNs key in the paid developer team and stores it in fnox and as a hosted Supabase secret, with the Push Notifications capability on the dev.sallvain.mylove App ID, sets whatever the hosted trigger needs to reach the sender (pg_net is dropped in 20251206024345_remote_schema.sql), and provisions a second fictional fixture pair on production beside story 2.7's. Then, with the sender story 3 deployed: a love note's insert on the hosted project reaches the sender through the trigger (the epic's Unknown, hosted half) and its push arrives through APNs on a device signed in to a fixture account; story 2's device proofs run there, because Apple discourages unregisterForRemoteNotifications: after an offline sign-out and a sign-in as the same account pushes arrive again, and after an offline sign-out and a sign-in as another fixture account the first account's partner's note shows nothing while the new account's pushes arrive. Whether the simulator also receives a real APNs sandbox push is recorded; a simulator build has registered and received a device token, but delivery was never tried. Fixes found here belong to this story; device observations are described in words, and no device token is committed."
verify = "With the key in fnox and as a hosted secret, a love note from the partner fixture account on the hosted project shows its push through APNs on the device with the sender's name and the text; after an offline sign-out and a sign-in as the same account pushes arrive again; after an offline sign-out and a sign-in as another fixture account the first account's partner's note shows nothing and the new account's pushes arrive; the plan records whether a real APNs sandbox push reached the simulator."
covers = ["R1", "R10"]
after = [2, 3]
hitl = true
risk = "high"


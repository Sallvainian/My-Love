type = "story"
title = "Each push type has a Settings switch"
description = "Settings in the shell gets a 'Push and reminders' section with six switches (moods, love notes, photos, pokes and kisses, dates, partner requests), laid out by the layout rules in the epic's Notes, each a general switch row this story extracts from MobileDataPhotosRow in Settings.tsx (taking the icon, label, helper, checked state, onChange and test id), with MobileDataPhotosRow rendering through it with its behaviour, text, ids and test ids unchanged, each on until changed and kept on the account in a new RLS-protected table. The sender skips a type the receiver switched off, for all their devices. When notification permission was declined, Settings says notifications are off in iOS Settings. The website, the Home Screen web app and older shells show no switches. The switches' store state is in signedOutState(). Extends the sender stories 1 and 4–6 built; in epic-date-reminders, story 4.2 adds a countdown-marks list to this section and story 4.3 a reminders switch stored in this story's table. The simulator checks run through story 2.9's driver and story 12's notification steps against story 2.9's fixture pair, with no person."
verify = "Unit tests cover the Settings section and the general switch row, Settings.mobileDataPhotos.test.tsx passes unchanged, and the sender's deno tests and an api-project spec show a type switched off builds no push for any of the receiver's devices and switching it on restores it; through story 2.9's driver on the simulator, each switch toggles in Settings, the setting survives an uninstall and reinstall, and a declined permission (the driver taps Don't Allow) shows the iOS Settings message; an E2E spec shows the website has no switches, and a shell built before this epic (story 2.9's earlier-commit build), updated by live update, shows none."

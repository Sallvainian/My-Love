type = "story"
title = "Push ships to the owner's iPhone"
description = "deploy.yml ships the migrations, every Edge Function (story 3) and the site, and a person installs a shell built from this epic on the owner's iPhone, with the partner's account on a second device or simulator. They run each Done when check against production with the fictional fixture accounts, and update a shell built before this epic by live update to confirm it, the website and the Home Screen web app still work with no switches."
verify = "On the owner's iPhone against production, every R1 and R2 action from the second device shows its push, each switch stops its push, love notes stack apart, the badge counts and clears, each tap opens its view, and sign-out stops pushes; an older shell updated by live update, the website and the Home Screen web app run with no error and no switches; CI is green on main."
covers = ["R1", "R2", "R3", "R4", "R5", "R6", "R7", "R8", "R9", "R10", "R11"]

# Epic 8, Daily Pushes and Nudge: every planned story in build order.
# Stories 1 and 2 are the epic 7 retrospective's items 8 and 9 (owner).
# Stories 3 and 4 are the sender and its switches, one deploy before any trigger
# (spine AD-10). Stories 5, 6 and 7 add the rows and triggers that fire it, 5
# first because it is the least certain part (pg_cron on hosted, two clocks).
# Stories 3, 5, 6 and 7 share migrations, the generated types and the pgTAP
# files, so each waits on the one before it. Story 8 is the nudge's client.

[[entry]]
id = 1
type = "story"
title = "The daily question slice is split into day, streak and history"
description = "Epic 7 retrospective item 8 (G1): dailyQuestionSlice.ts (1014 lines) becomes dailyDaySlice.ts (dailyDay, the pick queue and drain, the write prompt), dailyStreakSlice.ts (coupleStreak, the celebration and milestone claims) and dailyHistorySlice.ts (dailyHistory and its paging). Field and action names, localCopy kinds, signedOutState fields, session checks, sequence counters and the pair-change reset keep their behaviour, so no view or hook changes beyond import paths. The header comment is split with its part. What all three use (shownPartnerId, mergePartnerId) moves to one shared module; the pair-change reset and the partner subscription stay one subscriber, in the day slice, calling the streak and history slices' own reset. Stories 2, 8 and 9 build on the split: 8 and 9 in dailyDaySlice.ts. AGENTS.md's slice count and any comment naming the file change in the same commit. The spine's State row and layer diagram already name the three files and AD-12 names dailyDaySlice (1e5f8ea1), so the spine needs no edit."
verify = "npm run test:unit and the daily and partner E2E specs pass with no assertion changed, only import paths; npm run typecheck passes; dailyDaySlice.ts names no coupleStreak or dailyHistory field and dailyStreakSlice.ts and dailyHistorySlice.ts name no dailyDay field; the existing tests of the pair-change reset and of each session check still pass."
covers = ["R7"]
after = ["7.10"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "A failed read of a saved copy never overwrites it"
description = "Epic 7 retrospective item 9 (G2), closing DW-487 and DW-509: localCopy gains a read that tells an absent copy from a failed one, used by the four merges named there: mergeDailyDay, mergeDailyDays, addDeclinedWriteDay and claimCelebration. claimMilestone (#510) reads the same way but writes nothing on null, so it uses the new read too, as a regression case only. On a failed read the Daily merges keep the answer shown and write nothing, the declined list is left as it was, and claimCelebration answers as for no claim. A malformed value counts as absent, as today, so it is still replaced. readLocalCopy and its other callers stay as they are. Story 2 comes after story 1 because both rewrite the comments and the merge calls in the split slices; story 8 builds the nudge's spent rule on story 2's merge. DW-487 and DW-509 are marked done."
verify = "Unit tests fail the IndexedDB read once for each of the five functions and show the stored value unchanged and no write made, and a following successful call behave as today; an absent copy still seeds and merges as today; DW-487 and DW-509 are done in deferred-work.md."
covers = ["R8"]
after = [1,"6.8"]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "The sender knows the five daily pushes"
description = "No trigger yet; ships one deploy before the triggers (spine AD-10). A migration adds daily_nudges and daily_reminders (AD-9, AD-15, AD-17: RLS on, no privilege to anon or authenticated, service_role keeps its defaults; day_id not null, cascading with couple_days) with nothing writing them, push_requests columns daily_pick_id, daily_nudge_id and daily_reminder_id (cascading, unique with token, in the source check) and five push_preferences columns, boolean not null default true. send-push takes the five kinds (AD-10's table, never choice), builds push-copy.md's text from couple_streak and the question, drops a partner-picked push for a day that is not the recipient's current date and words a late both-answered push 'That day counts.' (both rules read the recipient's current date from the internal user_local_date(user_id, at): the stored zone, UTC with no row, in AD-15's list with only service_role EXECUTE; never a zone worked out in Deno), takes a reminder's sender to be the recipient's partner (the title names them; the self-addressed early return stays for the old kinds), gives the nudge and both 8 PM reminders aps.sound 'default' and the other three none, and sends nothing when that kind's switch is off. Delivers the R4 drop rule and the text and sound part of R2, R3 and R5; story 4 builds the switches on its columns, and stories 5 to 7 fire it. Types regenerated with npm run db:types."
verify = "deno test --no-lock supabase/functions/send-push/ shows each kind's payload, recipient, sound or none, drop rule, late wording and switch; a Playwright api spec inserts a reminder and a nudge row as admin, calls the sender and reads the recorded request, and an off switch records none for that kind and that person while the other kinds and the partner are still recorded; supabase test db covers the tables, columns, grants and cascade, and user_local_date (the stored zone's date, UTC with no row, no EXECUTE for anon or authenticated)."
covers = ["R1","R2","R3","R4","R5","R6"]
after = ["7.1","6.2"]
hitl = false
risk = "high"


type = "story"
title = "Picks push the partner and both answered"
description = "Spine AD-10: two AFTER INSERT triggers on daily_picks, by is_second, post daily_partner_picked and daily_both_answered to the story 3 sender. The partner-picked push never carries the choice. Both fire on every pick, an offline one sent after its date included (AD-10): the sender drops a late first pick's partner-picked push and words a late second pick's both-answered push 'That day counts.'"

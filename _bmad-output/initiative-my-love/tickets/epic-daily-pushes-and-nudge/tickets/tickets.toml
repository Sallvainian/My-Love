[[entry]]
id = 5
type = "story"
title = "The 8 AM and 8 PM pushes are scheduled on each person's clock"
description = "Spine AD-9: a migration installs pg_cron, adds enqueue_daily_reminders(at) and two named jobs (every 5 minutes; delete job_run_details over 7 days old), re-scheduled by name so a repeat is harmless, and the daily_reminders triggers for daily_question and daily_reminder. A person gets a reminder when linked, with a push device and a stored zone; morning 08:00-08:30 while they have not picked, evening 20:00-20:30 unless both have, evening_partner skipped when their evening nudge (daily_nudges, story 3) is spent; both slots call assign_couple_day, so every row has a day and evening_self can quote the question; each person in their own exception block, once per (user, date, slot). Reads the hosted catalog first. Its api spec calls enqueue_daily_reminders(at) only for its own pair (a zone no other pool account has), since other workers register devices for a moment. daily_reminders stays out of AUDITED_TABLES: the local job runs on real time and can add a row when a run crosses 08:00 or 20:00. dateReminders.ts does not change. Types regenerated with npm run db:types."
verify = "supabase test db with fixed instants: two partners on different clocks each get their own 8 AM and 8 PM, the window edges, picked and both-picked states, the evening-nudge skip, no device or no zone gives none, a repeat adds nothing, one person's error leaves the other's row; re-scheduling each job by name leaves one cron.job row per name; a Playwright api spec sees the recorded morning and evening requests; dateReminders.ts has no diff and its tests pass."
covers = ["R3","R5"]
after = [3]
hitl = false
risk = "high"

[[entry]]

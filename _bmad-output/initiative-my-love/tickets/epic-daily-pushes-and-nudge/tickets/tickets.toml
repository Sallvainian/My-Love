[[entry]]
id = 8
type = "story"
title = "The waiting screen's Nudge button nudges the partner"
description = "Client half, on story 7, in story 1's dailyDaySlice.ts. Builds the Waiting on Jessie board's dashed card (hourglass, 'Waiting on {partner}', 'They can't see your pick until they make theirs.', Nudge {partner}) in place of the plain line. The button greys when the slot is spent or null and while sending; offline it stays enabled, as the pick button does, and a tap refuses through requireOnline and shows offlineMessage. When send_daily_nudge refuses or the request fails, nothing is broadcast, the card shows 'Your nudge could not be sent.' in its failure box as a refused pick does, and Daily re-reads the day, so the button follows the server: greyed when the slot is spent or null, enabled when it is still open, and the reveal in place of the card when the partner has picked. On story 2's merge, the day merge never moves nudge.spent back while nudge.slot is unchanged, a new slot starts unspent, and a saved day without nudge reads as no slot (AD-13). Daily re-reads the day at 20:00 and on return, so the evening slot opens. A confirmed send broadcasts daily_nudge { day_id }, added to PARTNER_EVENTS (the tests that pin it unknown, partnerEvents.test.ts and broadcastSchemas.test.ts, and the one that pins the event list change): Daily's listener re-reads that day; the Partner page, partner-link and dates-changed listeners do nothing with it; story 9 calls this send; SUBSCRIBED and the other events are unchanged."
verify = "Playwright E2E: the waiting card's button sends once and greys, stays greyed after a reload, and an offline tap shows the message and sends nothing; unit tests cover the button states, a refusal and a failed request (the line, no broadcast, the re-read), the 20:00 re-read, the spent merge, and each registry event and SUBSCRIBED."
covers = ["R2"]
after = [7,2,"6.6"]
hitl = false
risk = "high"

[[entry]]
id = 9
type = "story"
title = "The app offers a nudge right after a pick"
description = "When this partner picked first, a pick the server just confirmed in this view raises a bottom sheet, 'Do you want to nudge your partner?' with Nudge and Not now, built as the write sheet is (epic 6) and clear of all four safe-area insets. It never shows on an open of Daily where the write sheet showed (owner, 2026-11-25, replacing epic 6's 2026-11-06 order), waits behind the +1 and milestone overlays, shows once, not after a reload or for a pick the queue sent, and not when the slot is spent or null; it closes if the partner picks while it is open. Nudge calls story 8's send; no connection shows offlineMessage on the sheet, and a refusal or failed request shows story 8's 'Your nudge could not be sent.' on the sheet while Daily re-reads the day. Daily's listener now also closes it on daily_pick; the story names what Daily does on every PARTNER_EVENTS event and SUBSCRIBED and tests each. First-picker E2E specs that tap Send my pick meet it and are updated (ten under tests/e2e use daily-send-pick; the live spec is story 11's)."
verify = "Playwright: the first picker sees it after the pick, and on the writer's day sees the write sheet and no nudge sheet; Nudge greys the waiting button and Not now leaves it; the second picker and a reload see none; unit tests cover the refusal, the offline message, the partner picking while it is open, and each registry event."
covers = ["R2"]
after = [8,"6.8"]
hitl = false
risk = "medium"


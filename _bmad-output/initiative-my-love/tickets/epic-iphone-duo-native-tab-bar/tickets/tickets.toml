# The epic's stories in build order. Stories 1, 6 and 3 were dropped in the
# 2026-10-30 replan and sit at the end; entries are never deleted.

[[entry]]
id = 7
type = "story"
title = "Find how the web code learns the side column's position and width in each pose"
description = "A spike that ships no behaviour. On the Xcode 27.1 iPhone Duo simulator and on the owner's Duo, in the shell, Safari and the Home Screen web app, record for each pose (outer portrait, outer landscape, inner portrait, inner landscape, and Split View if iOS offers it) which side the column is on and how wide it is, whether web content draws under it, whether a tap in the column's lower part reaches the page, what the page can read of it (the env(safe-area-inset-*) values, the page's width against the screen's), and whether those values change on a fold, unfold or rotation without a reload, and through which event. index.html sets viewport-fit=cover, and Capacitor's web view sets contentInsetAdjustmentBehavior to .never, so the shell's insets follow the web view's safe area. Read values through Safari's Web Inspector, or a temporary on-screen readout removed before the story ends. The owner's device screenshots carry real names: describe them in words in the plan, never commit them. The plan names the detection method stories 2 and 8 use, or says none works. It also owns the setup stories 2, 8 and 5 reuse, and epic-push-notifications' story 3.1 builds on: the fictional-data test account and its partner on production, and a simulator shell built with VITE_LIVE_UPDATE_URL pointed at a local latest.json (GITHUB_SHA=sim-local), because a locally built shell otherwise swaps itself back to production's web code when backgrounded. A person runs the simulator and the Duo through the poses."
verify = "The plan records, for each pose on the simulator and on the owner's Duo, in the shell, Safari and the Home Screen web app, the column's side and width, whether content draws under it and a tap there reaches the page, the safe-area inset values, the page's width against the screen's, and what changes on a pose change without a reload; it names the detection method stories 2 and 8 use, or says none works; no device screenshot or real name is committed, and no shipped code changed."
covers = []
after = []
hitl = true
risk = "high"

[[entry]]
id = 2
type = "story"
title = "The dock becomes a vertical bar in the side column without covering content"
description = "Using story 7's detection method, AppNavigation's dock, in a pose where the page has a side column, renders as a vertical capsule at the column's bottom holding the five buttons, icons only with the active one on a highlight, in the bottom dock's glass and button size and as wide as story 7's measured column, with the header and content running on under iOS's status above it, and is today's bottom dock where there is none; a pose change switches form without a reload or a change of view. Buttons keep their labels as accessible names (R3 for the five destinations; story 8 adds Settings) and the same navigation as today. If story 7's method needs native code, this story adds the plugin behind a Capacitor.isPluginAvailable check and confirms that a shell without it keeps the bottom dock. The dock variables in src/index.css follow the form: in column poses content clears the column dock, no bottom-dock band remains, and Love Notes ends at the column dock and runs to the bottom of the screen; content may run under iOS's status capsule. Updates AGENTS.md's dock-clearance paragraph for the column form. Unit tests cover both forms from story 7's inputs. Reuses story 7's simulator setup; a person runs the simulator poses. Hands story 8 the column form it adds Settings to."
verify = "Unit tests cover both forms; on the Duo simulator, screenshots from the test account show the capsule with five buttons at the column's bottom in each column pose and today's bottom dock in inner portrait and on a non-Duo iPhone simulator; folding, unfolding and rotating switch form without a reload and keep the view; each button opens its view and shows active, and a reload reopens it marked; in each column pose every view scrolled to its end shows its last item whole and clear of the column dock with no bottom band, and Love Notes' composer sits at the bottom beside the column dock; Accessibility Inspector reads each button's name; the dock's E2E specs pass."
covers = ["R1", "R2", "R3", "R4", "R5"]
after = [7]
hitl = true
risk = "medium"
unknown = "How the web code learns the side column's position and width in each pose. Story 7 answers it; if no way works, this entry is re-sliced. If it needs native code, epic-push-notifications' story 3.1 also waits on 2.2, and epic-date-reminders gets epic 2 back in its after in the initiative breakdown, with 4.1 waiting on 2.4 and 4.5 on 2.5, since they then share the Xcode project and a shell install; apply this before 3.1 starts."

[[entry]]
id = 8
type = "story"
title = "Settings is the sixth button in the column dock"
description = "Using story 7's detection method through story 2's column dock: in column poses, that dock gains Settings as a sixth button grouped with the others, marked active while Settings is open, and the header shows no Settings gear; where there is no column the gear stays in the header and the bottom dock keeps five buttons. The button reaches Settings the way the gear does today. Updates AGENTS.md's lines that Settings is the top-bar gear and not a dock item, for column poses. Unit tests cover the gear and the button in both forms. Reuses story 7's simulator setup; a person runs the simulator checks."
verify = "Unit tests cover both forms; on the Duo simulator in each column pose the column dock shows six buttons, its Settings button opens Settings and shows active, and the header has no gear; in inner portrait and on a non-Duo iPhone simulator the gear opens Settings beside a five-button dock; Accessibility Inspector reads Settings; the dock's and Settings' E2E specs pass."
covers = ["R3", "R8"]
after = [2]
hitl = true
risk = "low"


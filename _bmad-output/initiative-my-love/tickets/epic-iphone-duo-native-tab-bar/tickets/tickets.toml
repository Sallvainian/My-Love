type = "story"
title = "Settings is the sixth button in the column dock"
description = "Using story 7's detection method through story 2's column dock: in column poses, that dock gains Settings as a sixth button grouped with the others, marked active while Settings is open, and the header shows no Settings gear; where there is no column the gear stays in the header and the bottom dock keeps five buttons. The button reaches Settings the way the gear does today, and its label is R3's Settings name (story 2 delivers R3 for the five destinations). The taller six-button capsule still clears content (R4). In the shell the header's top-left notifications button stays at the top-left in column poses, with a matching space on the right where the gear was so the wordmark stays centred. Updates AGENTS.md's lines that Settings is the top-bar gear and not a dock item, for column poses. Unit tests cover the gear and the button in both forms. The simulator checks run through story 9's driver against the local stack, with no person."
verify = "Unit tests cover both forms. Through story 9's driver, on the Duo simulator in each column pose the column dock holds six buttons' frames, its Settings button opens Settings and reads as active, and the header has no gear; in unfolded portrait and on a non-Duo iPhone simulator the gear opens Settings beside a five-button dock; the driver reads Settings' accessibility label; in each column pose every view scrolled to its end has its last item's frame clear of the six-button dock; the header's wordmark is centred; the dock's and Settings' E2E specs pass."
covers = ["R3", "R4", "R8"]
after = [2]
hitl = false
risk = "low"


# The epic's stories in build order. Stories 1, 6 and 3 were dropped in the
# 2026-10-30 replan and sit at the end; entries are never deleted.

[[entry]]
id = 7
type = "story"
title = "Find how the web code learns the side column's position and width in each pose"
description = "A spike that ships no behaviour. On the Xcode 27.1 iPhone Duo simulator and on the owner's Duo, in the shell, Safari and the Home Screen web app, record for each pose (outer portrait, outer landscape, inner portrait, inner landscape, and Split View if iOS offers it) which side the column is on and how wide it is, whether web content draws under it, whether a tap in the column's lower part reaches the page, what the page can read of it (the env(safe-area-inset-*) values, the page's width against the screen's), and whether those values change on a fold, unfold or rotation without a reload, and through which event. index.html sets viewport-fit=cover, and Capacitor's web view sets contentInsetAdjustmentBehavior to .never, so the shell's insets follow the web view's safe area. Read values through Safari's Web Inspector, or a temporary on-screen readout removed before the story ends. The owner's device screenshots carry real names: describe them in words in the plan, never commit them. The plan names the detection method stories 2 and 8 use, or says none works. It also owns the setup stories 2, 8 and 5 reuse, and epic-push-notifications' story 3.1 builds on: the fictional-data test account and its partner on production, and a simulator shell built with VITE_LIVE_UPDATE_URL pointed at a local latest.json (GITHUB_SHA=sim-local), because a locally built shell otherwise swaps itself back to production's web code when backgrounded. A person runs the simulator and the Duo through the poses."
verify = "The plan records, for each pose on the simulator and on the owner's Duo, in the shell, Safari and the Home Screen web app, the column's side and width, whether content draws under it and a tap there reaches the page, the safe-area inset values, the page's width against the screen's, and what changes on a pose change without a reload; it names the detection method stories 2 and 8 use, or says none works; no device screenshot or real name is committed, and no shipped code changed."
covers = []
after = []
hitl = true
risk = "high"

[[entry]]
id = 9
type = "story"
title = "The simulator driver is a repo tool"
description = "Ports the prototype in the epic's sim-driver-prototype/ folder (an xcodegen project with a host app and a UI-test target, drive.sh and notify.sh) into a tool in the repo that a loop session runs with no person, kept out of ios/App's Xcode project so the shipped app does not change: Drive.swift and drive.sh with a minimal host app; Notify.swift, notify.sh and the host app's notification probes are story 3.12's. It builds and installs the shell from the working tree against the local stack (vite --mode test and .env.test), uninstalling the earlier shell first, with a live-update URL that keeps it on its own web code, as story 7's Setup explains, and builds outside dist/ so no test-mode build is ever left where npx wrangler deploy would upload it; can also build the shell from an earlier commit and serve the working tree's bundle to it as a live update at a local latest.json, for the older-shell checks of stories 3.1, 4.1 and 4.6; owns a linked fixture pair on the local stack that no E2E worker slot uses (tests/support/auth/worker-pool.ts), provisioned by the tool, and signs either account in through the login form; sets the pose with ax pose closed|partial|open and rotates with ax rotate (XCUIDevice orientation changes take effect only once); taps at points offset from app.webViews.firstMatch's origin, never the app frame, which XCUITest reports as portrait on the unfolded display; scrolls the web view; dumps the web view's accessibility elements (label, value, frame) as JSON; saves screenshots with xcrun simctl io --display; and can inject story 7's readout into a build it owns, read back as text, never leaving it in dist/ or ios/App/App/public/. AGENTS.md gains the lines a session needs: where the tool lives, that a run needs ax and xcodegen installed with every `ax doctor` line ok, the Mac unlocked, and Device Hub open, not minimised and on the current Space (or assigned to All Desktops), though it need not be in front, that one Duo story runs at a time (or on a simctl clone), and that simulator results are trusted for the shell only, because story 7 found the simulator's Safari and Home Screen web app differ from the Duo. It closes DW-328 by reading both side insets in the shell on a non-Duo iPhone simulator in portrait and each landscape direction; the iPhone 18 Pro simulator rendered story 7's readout build blank on iOS 27.0 and 27.2, and the installed iPhone 17, 17e and Air simulators are untried, so any non-Duo iPhone simulator that renders the shell serves. Hands the tool to stories 2 and 8, to stories 3.12 and 4.7 that extend it, and its fixture pair and local shell build to story 3.1 and every push and reminder story after it."
verify = "With no person acting, on the iPhone Duo simulator the tool builds and installs the shell from the working tree, signs in a local fixture account, and in folded portrait, both folded landscapes, unfolded portrait and unfolded landscape reads story 7's readout as text matching story 7's shell rows; taps inside the column in folded landscape-secondary, folded landscape-primary and unfolded landscape reach the page (the readout's last tap); on a non-Duo iPhone simulator it reads both side insets in portrait and each landscape direction, and DW-328 is closed or rewritten in the ledger with those values; a shell built from main takes the working tree's bundle by live update from a local latest.json and runs it; at the end no committed file or build folder holds the readout, and dist/ holds no test-mode build; lint and typecheck pass for any TypeScript it changes (ESLint ignores scripts/, so the tool itself is checked by the runs above)."
covers = []
after = [7]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "The dock becomes a capsule in the side column without covering content"
description = "AppNavigation's dock chooses its form by story 7's detection method: the page has a side column when exactly one of env(safe-area-inset-left) and env(safe-area-inset-right) is non-zero, that side being the column. JavaScript reads the two from the computed padding of an element padded with env(safe-area-inset-*) and re-reads them on visualViewport resize, screen.orientation change and a ResizeObserver on that element, because the outer display's flip between its landscapes fires no ResizeObserver and the side-by-side pane swap fires none of the other events; never screen.*, the user agent or display-mode. The rule for a non-Duo iPhone, both side insets non-zero in landscape, rests on story 9's measured insets (DW-328). No native code is needed. Only the shell draws under the column: Safari and the Duo's Home Screen web app report no column and keep the bottom dock, as story 7's Duo rows record (the simulator's web app differs from the Duo, so it is not checked here; story 5 checks both on the device). In a pose where the page has a side column, the dock renders as a vertical capsule at the column's bottom holding the five buttons, icons only with the active one on a highlight, in the bottom dock's glass and button size and as wide as the column's inset value, never a fixed 84 pt, with the header and content running on under iOS's status above it, and is today's bottom dock where there is none; a pose change switches form without a reload or a change of view. Buttons keep their labels as accessible names (R3 for the five destinations; story 8 adds Settings) and the same navigation as today. The dock variables in src/index.css follow the form: in column poses content clears the column dock, no bottom-dock band remains, and Love Notes ends at the column dock and runs to the bottom of the screen; content may run under iOS's status capsule. Updates AGENTS.md's dock-clearance paragraph for the column form. Unit tests cover both forms from story 7's inputs, both side insets non-zero among them. It seeds story 9's fixture pair with enough rows for each view to scroll. The simulator checks run through story 9's driver against the local stack, with no person. Hands story 8 the column form it adds Settings to."
verify = "Unit tests cover both forms, the exactly-one-side rule and each re-read signal, including the side-by-side pane swap that only the ResizeObserver reports. Through story 9's driver, on the Duo simulator with the shell signed in as a local fixture account: in folded portrait, both folded landscapes and unfolded landscape the five buttons' frames sit inside the column at its bottom, and in unfolded portrait the bottom dock shows; on a non-Duo iPhone simulator in portrait and both landscapes the bottom dock shows; folding, unfolding and rotating switch form without a reload and keep the view; each button opens its view and reads as active; in each column pose every view scrolled to its end has its last item's frame whole and clear of the column dock with no bottom band, and Love Notes' composer reaches the screen's bottom beside the column dock; the driver reads each button's accessibility label and saves a screenshot of each pose. A reload reopens the view with its button marked (E2E for the bottom dock, a unit test for the column form), and the dock's E2E specs pass."
covers = ["R1", "R2", "R3", "R4", "R5"]
after = [7, 9]
hitl = false
risk = "medium"

[[entry]]

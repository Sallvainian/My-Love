# The initiative's epics in build order. Migrated from v6 by `bmad migrate`.

[[epic]]
id = 1
slug = "epic-test-review-remediation"
title = "Test Review Remediation"
description = "Every finding from the 2026-09-25 and 2026-10-03 TEA test reviews is fixed, so a green suite means the behaviour works and a fresh review of each test folder reports no Critical or High."
covers = []

[[epic]]
id = 2
slug = "epic-iphone-duo-native-tab-bar"
title = "iPhone Duo Side-Column Dock"
description = "Wherever the page has a side column, as on iPhone Duo folded and in unfolded landscape, the app's own dock is a vertical bar in that column with its buttons grouped at the bottom and Settings as a sixth; everywhere else the header and five-button bottom dock stay as they are."
covers = []

[[epic]]
id = 3
slug = "epic-push-notifications"
title = "Push Notifications"
description = "The native iOS shell gets a push on the partner's phone for moods, love notes, photos, pokes and kisses, visible date changes and partner requests, with a Settings switch per type, love notes in their own lock-screen group and an unread-notes badge."
covers = []
after = [{ epic = 2, needs = "story 2.9: the simulator driver story 3.12 extends with notification steps and every unattended push story checks through, and story 2.4: the Duo sweep, which may change the driver too" }]

[[epic]]
id = 4
slug = "epic-date-reminders"
title = "Date Reminders"
description = "The native iOS shell schedules 9:00 local reminders before every date (day before; month and week before for countdown-marked dates; on the day for anniversaries and birthdays), with a Settings switch, and no notification for the daily message."
covers = []
after = [{ epic = 2, needs = "story 2.9: the simulator driver story 4.7 extends with the scheduled-reminders reader, and story 2.4: the Duo sweep, which may change the driver too" }, { epic = 3, needs = "story 3.12: the notification steps story 4.7 builds after, since both change the driver and its host app; story 3.1: the one iOS notification permission prompt; story 3.7: the Settings notifications section; story 3.8: the non-love-note lock-screen group name; story 3.9: the cold-start and background navigation a reminder tap reuses; stories 3.10 and 3.11: the push sweep and device install, which share the Settings section, the native code and the owner's iPhone" }]

[[epic]]
id = 5
slug = "epic-settings-rework"
title = "Settings Rework"
description = "Settings is a stack of one-line rows that each open their own page, as the Settings UX spines describe; every date is edited, deleted and reminded from its own page, reached from its Home card or the Dates list; and adding or changing a date sends no push."
covers = []
after = [{ epic = 2, needs = "story 2.8: the header gear and the column dock's sixth button that open Settings" }, { epic = 3, needs = "stories 3.5, 3.6, 3.7 and 3.9: the date-change push path, the push_requests source check, the push switches and the push tap routes this epic removes or moves" }, { epic = 4, needs = "stories 4.2 and 4.3: the per-date countdown marks and the Date reminders switch whose rows move onto each date's page" }]

[[epic]]
id = 6
slug = "epic-daily-question"
title = "Daily Question"
description = "Daily replaces Mood in the dock; each day both partners pick one this-or-that question blind, the server withholding each pick until the other's own exists, then see the reveal; one partner a day, in turns by date, is asked right after their own pick to write tomorrow's question or leave it to the pool; offline picks send on reconnect, each partner's day runs on their own clock, and an unlinked account sees an invitation to link."
covers = ["R1", "R2", "R3", "R4", "R12", "R17", "R18", "R20"]

[[epic]]
id = 7
slug = "epic-streak-and-partner-page"
title = "Streak and Partner Page"
description = "The couple's shared streak and current run show on Daily and the Partner page with their colours, the +1 animation and the 25-day flaming-heart badges, and the Partner page holds the streak and the past questions marked Same or Different in place of the mood card, recent moods and Poke/Kiss/Fart tiles."
covers = ["R5", "R6", "R7", "R8", "R9", "R11", "R17"]
after = [{ epic = 6, needs = "the stored picks and the per-partner day rule that decide when a day is done or missed" }]

[[epic]]
id = 8
slug = "epic-daily-pushes-and-nudge"
title = "Daily Pushes and Nudge"
description = "The five daily-question pushes arrive on each recipient's own clock, the waiting screen's Nudge sends the partner a push, and each new push kind has its own Settings switch."
covers = ["R2", "R13", "R14", "R19"]
after = [{ epic = 6, needs = "the picks and the per-partner day the pushes are timed and worded on" }, { epic = 7, needs = "the streak count the push copy quotes" }]

[[epic]]
id = 9
slug = "epic-reply-in-love-notes"
title = "Reply in Love Notes"
description = "The reveal's one action, Reply in Love Notes, opens Love Notes with the reply attached to that day's question, and both partners see the sent note with the question attached."
covers = ["R10"]
after = [{ epic = 6, needs = "the reveal card and the stored question a reply points at" }, { epic = 7, needs = "the reveal card's +1 animation, so the two epics do not change the card at once" }, { epic = 8, needs = "its migrations and regenerated database types, and its changes to epic 6's screens, so the two epics do not change them at once" }]

[[epic]]
id = 10
slug = "epic-remove-moods-and-interactions"
title = "Remove Moods and Poke/Kiss/Fart"
description = "No mood or Poke/Kiss/Fart screen, code path, push kind, Settings switch, server row or device copy remains, while the shared Realtime registry and the partner-linked signal keep working."
covers = ["R15", "R16", "R19"]
after = [{ epic = 6, needs = "Daily in the dock slot Mood held" }, { epic = 7, needs = "the Partner page no longer reading moods or interactions" }, { epic = 8, needs = "the new push kinds and switches beside the ones this epic deletes in send-push and the Settings notifications page" }, { epic = 9, needs = "its migrations and regenerated database types, so the two epics do not change them at once" }]

# Epic 7, Streak and Partner Page: every planned story in build order.
# Stories 1 (server) and 2 (client) together are the tracer bullet: both
# partners pick on Daily and each Partner page shows the streak at 1.
# One lane: every story from 2 on changes dailyQuestionSlice, and 1 and 7 both
# add migrations, the AD-5 gate pgTAP file and the generated types, so each
# story waits on the one before it. Story 4 adds the E2E helper that seeds a
# pair's past days, which stories 6, 7 and 8 use.
# A story that adds a subscriber to the partner-event registry names what its
# screen does on every event in PARTNER_EVENTS (partner_linked, daily_pick,
# new_mood, dates_changed) and on SUBSCRIBED, and tests each (epic 6
# retrospective, item 10).

[[entry]]
id = 1
type = "story"
title = "The server counts the couple's streak"
description = "Server half of the tracer; story 2 builds the Partner page on it. A migration adds spine AD-7's internal couple_streak(user_a, user_b, viewer, at) and the client RPC get_couple_streak() (security definer, search_path '', in FN-GRANT-008, types regenerated with npm run db:types), answering { status: 'ok', streak } | { status: 'unlinked' } and throwing on failure, as get_daily_day does. streak holds held, run, today_state (grey | orange | blue for the viewer's date), milestones (floor(held / 25)), same, done, missed (the closed dates missed in a row since the newest done day, 0 when the newest closed day is done) and week (the viewer's last seven dates ending today, each done, missed or open), so no client works out a day's state. A day is done when both picks exist and closed once the later partner's local midnight has passed (AD-3); a missed day is any closed date since the couple's first day that is not done, dates with no row included. Nothing is stored, so a pick that reaches the server after midnight corrects the count by itself. get_couple_streak goes in the AD-5 gate pgTAP file."
verify = "supabase test db over fixed instants: held, run, missed and today_state follow done and missed days, a run of missed days staying blue until both pick; partners an hour apart close a day only after the later midnight; a pick made at 11:50 PM and submitted at 12:10 AM raises held for the earlier date; relinking the same partner counts the unlinked days as missed; week marks each of the last seven dates; an unlinked caller gets status unlinked; the gate file shows nothing get_couple_streak returns counts today before the second partner's own pick; npm run db:types leaves the committed types unchanged."
covers = ["R1", "R2", "R3", "R5", "R8"]
after = ["6.2"]
hitl = false
risk = "high"

[[entry]]
id = 2
type = "story"
title = "The Partner page shows the couple's streak in place of the partner's moods"
description = "Client half of the tracer, on story 1's get_couple_streak. Builds the Partner page in a new folder, src/components/PartnerView/ (spine Conventions; epic 10 deletes PartnerMoodView/; not PartnerPage, which Settings/PartnerPage.tsx already exports), on the same partner view: the partner's name and the design's streak card (held as 'days answered together', run as 'in a row', the week strip, 'Next milestone: {n} days · {k} to go'), orange, grey or blue by today_state, with the plain flame. Partner search, sent and received requests, accept and decline move into the new folder unchanged, test ids kept, and so does PartnerLoadError, with Settings/PartnerPage.tsx's import repointed; an unlinked answer shows only them. The mood card, recent moods, Poke/Kiss/Fart tiles and the mood toast leave the page; their code stays for epic 10. The streak lives in dailyQuestionSlice (session check, field in signedOutState). Registry (epic 6 retrospective item 10): SUBSCRIBED and partner_linked re-read the streak (partner_linked the partner too, as usePartnerLinkListener does); daily_pick re-reads the streak; new_mood and dates_changed do nothing. E2E: partner-mood.spec.ts, partner-kit.spec.ts, interaction-record-ownership.spec.ts, interaction-subscription-warning.spec.ts and interactions-offline-copy.spec.ts, whose subject is a removed part, are deleted; the mood or Poke/Kiss/Fart steps in realtime-recovery-after-renewal.spec.ts, needs-a-connection.spec.ts, partner-offline-copy.spec.ts, mood-offline-copy.spec.ts, dock.spec.ts, settings-navigation-rules.spec.ts and theme-sweep.spec.ts are removed or pointed at the new page; partner-connect.spec.ts runs on the new page. Seen running when done: two linked accounts on a local stack both pick on Daily, and each Partner page shows 1 day answered together, 1 in a row, in orange."
verify = "Playwright on a local stack: an unlinked account's Partner page searches, requests and links as before; after both partners of a linked pair pick, each Partner page shows 1 day answered together and 1 in a row in orange, with no mood card, recent moods or Poke/Kiss/Fart tiles; Settings' partner page still shows its load error; a unit test per partner event and SUBSCRIBED shows the page re-reading on SUBSCRIBED, partner_linked and daily_pick and doing nothing on new_mood and dates_changed; the slice's streak field clears on sign-out; the full E2E suite passes."
covers = ["R1", "R2", "R3", "R6"]
after = [1, "6.6"]
hitl = false
risk = "high"

[[entry]]

[[entry]]
id = 9
type = "story"
title = "Past questions show offline"
description = "History days merge into the daily-days copy through mergeDailyDay (spine AD-13: one map keyed by day_id, never a second copy), so the Past questions card, the See all page and the count show offline. The copy keeps every saved day: MAX_SAVED_DAILY_DAYS and its prune go (owner, 2026-11-07; the 31-day cap was picked in story 6.5 only to show today offline, and a day costs a few hundred bytes). A day from another pairing is never shown, on Daily as well: each saved day records the partner it was read with and only the current partner's are shown, and a server answer for a date drops every other day_id saved for that date. Together these close DW-492, both after a relink and after reset_bot_daily_days. Its relink E2E uses throwaway accounts, never the worker-pool pairs (AGENTS.md)."
verify = "Playwright on a local stack: a linked account that loaded Past questions goes offline and still sees them and the count after a reload; two throwaway accounts relinked to other partners see neither Daily nor Past questions show the old pair's days; with 35 done days seeded through story 4's helper, offline See all shows all 35 rows under its count; unit tests show a failed read never dropping saved days, no cap on saved days, and a server answer for a date dropping that date's other day_ids."
covers = ["R7"]
after = [8]
hitl = false
risk = "medium"


[[entry]]
id = 5
type = "story"
title = "The streak's +1 plays once for each new day"
description = "Spine AD-13's device-state kind daily-celebrated { held, milestones }, written only by the animation; a first read with nothing stored seeds it from the current streak without playing. Story 6 reads and writes its milestones. The localCopy.ts header exempts it from the server-fill rule in the same change, and sign-out deletes it. The design's Streak goes up by one screen (the flame lighting from grey, held rolling up with '+1', today filling in the week strip, 'You and {partner} both answered. {run} days in a row!', and 'See {partner}'s pick' opening the reveal) plays whenever Daily is on screen and the streak's held exceeds the stored one: at once after the second pick, and for the first picker on the next open of Daily or when the partner's pick arrives while Daily is open. The Partner page shows the new count without playing it or changing the stored one. Reduce Motion shows the end state without movement. The counter keeps the plain flame."
verify = "Playwright on a local stack: the second picker sees the +1 at once; the first sees it on the next open of Daily, and in a second run while Daily is open when the partner's pick arrives; each sees it once, with no replay after a reload; opening the Partner page first shows the new count and Daily then still plays it; unit tests show the first read seeding without playing and Reduce Motion showing no movement."
covers = ["R4"]
after = [4]
hitl = false
risk = "medium"


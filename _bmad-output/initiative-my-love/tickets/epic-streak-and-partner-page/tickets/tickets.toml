title = "The streak shows offline from its saved copy"
description = "Spine AD-13's streak snapshot becomes the localCopy kind daily-streak: an ok answer from get_couple_streak replaces it, an unlinked answer removes it, and a failed read never touches it. Its registerLocalCopy read is stubbed in auth-bootstrap-notification-order.tsx and login.spec.ts. Every screen that shows the slice's streak shows the saved one offline and after a failed read, a failed read never blanks a streak already shown, and with nothing saved and no connection it says the streak needs a connection. Sign-out deletes the kind with the account's other kinds."
verify = "Playwright on a local stack: a linked account that loaded the Partner page goes offline and still sees its streak after a reload; a failed get_couple_streak keeps the streak shown; unit tests show an ok answer writing the copy, an unlinked one removing it and a failure leaving it."
covers = ["R6"]
after = [2]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Daily shows the streak, the week and a missed day"
description = "On Daily, from the design's Today's question, Waiting on Jessie, Both answered and After a missed day screens: the streak chip beside the date (held with the plain flame, '{run} in a row' under it; grey, orange, or blue with the snowflake, by today_state), the week strip, the waiting screen's 'Your half is in. The streak lights up when {partner} answers too.', and while blue the missed-day banner 'Your streak went cold' with '{Yesterday was | The last {missed} days were} missed, so it's frozen at {held}. You keep the {held}. Both answer today to light it back up.' The streak is re-read once the own pick is confirmed, a queued pick sent later by story 6.7's drain included, so a late pick's correction shows. Registry (item 10), on useDailyPickListener's existing subscriber: SUBSCRIBED re-reads the day as now, and the streak; partner_linked already re-reads the day (DW-490, PR #490) and now re-reads the streak too; daily_pick re-reads the day as it does now, and the streak; new_mood and dates_changed do nothing. Adds the E2E helper that seeds a pair's past done and missed days, which stories 6, 7 and 8 use; linking in its E2E goes through seedRequest and acceptFromPartnerTab in tests/support/helpers/partner-requests.ts."
verify = "Playwright on a local stack over seeded days: the chip, week strip and banner on Daily, and the streak card on the Partner page, show grey, orange and blue as today_state says, and the waiting screen shows its sentence; a pick queued offline and sent on reconnect updates the streak; an account whose request is accepted while Daily is open sees the streak without leaving Daily (linked through tests/support/helpers/partner-requests.ts); unit tests show Daily's handling of SUBSCRIBED and each partner event."

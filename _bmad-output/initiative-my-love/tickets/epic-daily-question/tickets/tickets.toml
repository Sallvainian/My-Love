verify = "pgTAP shows consecutive dates naming alternate writers, a written question assigned to both partners the next day, a day whose writer wrote nothing drawing from the pool, and each invalid form (blank, 41 characters, same ignoring case, not the writer, before the own pick, a past date) refused."
covers = ["R3", "R4", "R5"]
after = [2]
hitl = false
risk = "medium"


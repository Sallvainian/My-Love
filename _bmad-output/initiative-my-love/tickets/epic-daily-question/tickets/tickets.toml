[[entry]]
id = 11
type = "story"
title = "After every deploy, a test checks Daily on the real website"
description = "A Playwright spec that signs in the production Claude bot pair: both see the same question, the second partner's get_daily_day and get_daily_day_by_id answers before their pick carry no trace of the first pick's choice, then both pick and see the reveal. The bot's login uses CLAUDE_BOT_PASSWORD and the partner bot's uses its own CLAUDE_BOT_PARTNER_PASSWORD, which scripts/provision-push-fixtures.mjs sets on that account (66e69812; PUSH_FIXTURE_PASSWORD is shared with the push fixtures). The spec never uses the Supabase secret key. Before each run it signs in as each bot and calls the new client RPC reset_bot_daily_days() (security definer, spine AD-15; gate file, FN-GRANT-008, types), which deletes only the calling user's couple's couple_days rows (their picks cascade) and refuses unless the caller's email is test_email or partner_email in claude_bot_config, so the check can rerun any number of times a day. On a local stack, where claude_bot_config holds the two bot emails but no account has them, the spec's setup signs both up through the anon key (local email sign-up needs no confirmation) when they are missing, and links them the way the app does, by a partner request and accept_partner_request; the spec runs alone, outside the per-worker pool. deploy.yml runs the spec after its health-check job, against the live site, so a failed check fails the deploy. The story does not run gh secret set: it lists the GitHub secrets the job needs, which the owner sets after the epic merges. It never signs in, reads or deletes the owner's or partner's account."
verify = "pgTAP shows reset_bot_daily_days refusing a non-bot caller and a bot caller unable to delete another couple's rows; on a fresh local stack the spec creates and links the two bot accounts and passes twice in a row; deploy.yml lists the job after health-check, and the story's plan lists the GitHub secrets it needs. The live run happens once the owner has set them after the epic's merge to main."
covers = ["R1", "R2"]
after = [10]
hitl = false
risk = "medium"

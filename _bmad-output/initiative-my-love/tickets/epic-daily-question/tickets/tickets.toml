# Epic 6, Daily Question: every planned story in build order.
# Stories 1 (server) and 12 (client) together are the tracer bullet; story 1
# was split in two to keep each loop story inside its token budget.
# Two lanes share most files. The server lane (migrations, the AD-5 gate pgTAP
# file, src/types/database.types.ts) and the client lane (dailyQuestionSlice,
# src/components/DailyQuestion/) both run through stories 1, 12, 2, 3, 5, 6, 7
# and 8, so those wait on each other in order. The pool (4) touches only its
# seed migration and can run beside them once story 1 is in; the dock slot (9)
# waits on story 12's view and on story 6, which ports the realtime-recovery
# spec off moods before story 9 deletes the mood-only specs.
# Every story adds each new client RPC to the AD-5 gate pgTAP file in the same
# change, updates the existing E2E specs and helpers its change breaks, and
# clears its worker pair's day rows through story 1's E2E helper before each
# test, because picks are insert-only and burn-in repeats a spec on one database.

[[entry]]
id = 1
type = "story"
title = "The server assigns today's question and releases a pick's choice only to a partner who has picked"
description = "Server half of the tracer; story 12 builds the client on it. A migration adds daily_questions with every column the spine gives it (pair null for the coach's rows; pair, target_day and source_day_id for written ones, so stories 3 and 4 add rows, not columns), couple_days and daily_picks, each with RLS on and no policies; it revokes every privilege from anon and authenticated explicitly, since 20260725170000_grant_api_roles_on_public.sql grants ALL on future tables, and gives service_role column SELECT on daily_picks except choice (AD-5, AD-15). Internal functions: effective_zone, assign_couple_day (pool draw with cycles, writer fixed by date; no written questions yet), visible_daily_picks and daily_day_snapshot (every AD-16 field except nudge, which epic 8 adds with daily_nudges). Client RPCs, in FN-GRANT-008 with their final signatures: get_daily_day(time_zone, utc_offset_minutes, reported_at) answering { status: 'ok', snapshot } | { status: 'unlinked' } and throwing on failure, and submit_daily_pick(day_id, choice, picked_at, time_zone, utc_offset_minutes), insert-only, idempotent, is_second stored (AD-6); story 2 adds the date and picked_at checks and the zone store. Adds the AD-5 gate pgTAP file (cycle tests delete coach rows inside their transaction, so story 4's seed never changes them), regenerates the types with npm run db:types, and adds the E2E helper that deletes a worker pair's couple_days rows (cascading to picks) before a test, which story 12 and every later spec use."
verify = "supabase test db passes: two linked users get the same question from get_daily_day, each pick belongs to its picker, the gate file shows the second partner gets no choice, Same/Different mark or count from either RPC before their own pick and is denied a direct select on daily_picks, a repeated submit returns the stored pick unchanged, and consecutive days draw distinct questions until a test pool is used up; npm run db:types leaves the committed types unchanged."
covers = ["R1", "R2", "R5"]
after = []
hitl = false
risk = "high"

[[entry]]
id = 12
type = "story"
title = "Both partners pick today's question and see the reveal"
description = "Client half of the tracer, on story 1's RPCs: dailyQuestionApi, dailyQuestionSlice (session check, fields in signedOutState; it keeps story 1's unlinked status, whose screen is story 5's) and the Daily view at /daily registered in ViewType, pathMap, both URL ternaries and the render chain (the dock slot is story 9): Today's question shown as '{This} or {That}?' in plain text, whether the partner has picked, Send my pick (refused offline through isOnline() and offlineMessage until story 7 queues it), the waiting screen with the own pick and its time, and the reveal marked Same picks or Different picks. Tests insert their own questions and clear the pair's days with story 1's E2E helper; story 4 seeds the pool. Seen running when done: two linked accounts at /daily on a local stack see the same question, pick, and see the reveal after a reload."
verify = "On a local stack, a Playwright spec signs in a linked pair at /daily on two pages: both see the same question, the second sees that the first has picked after a reload, each picks, and after a reload both see the reveal with Same or Different; the slice's unit tests show its fields cleared on sign-out."
covers = ["R1", "R2", "R5"]
after = [1]
hitl = false
risk = "high"

[[entry]]
id = 2
type = "story"
title = "Each partner's day runs on their own clock"
description = "Finishes AD-2, AD-3 and AD-6's dating on story 1's RPCs and story 12's screens. Adds user_time_zones (RLS on, every privilege revoked from anon and authenticated, types regenerated with npm run db:types), written only by get_daily_day when reported_at is newer than the stored one, a reported_at later than now() + 5 min being clamped to now(). submit_daily_pick dates the pick by picked_at in the zone sent with it, refuses a picked_at outside created_at - 5 min to now() + 5 min, and fails with its own error code when the date is not the day's. The client refuses a pick when the device date is not the shown day and re-fetches. Moves formatDateKey out of calendarHelpers.ts first (spine Deferred), since Daily is its next importer. Story 7's queue relies on the late-pick rule this story proves."
verify = "pgTAP over fixed instants shows a pick made at 11:50 PM and submitted at 12:10 AM counted for the earlier date, and partners an hour apart each picking at 11:30 PM local landing on the same date; a picked_at more than 5 minutes ahead is refused with its error code; the database types match npm run db:types."
covers = ["R7", "R9"]
after = [12]
hitl = false
risk = "high"

[[entry]]

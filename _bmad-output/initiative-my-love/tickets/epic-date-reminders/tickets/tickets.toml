# The epic's stories in build order.

[[entry]]
id = 1
type = "story"
title = "The planner schedules every date's day-before and on-the-day reminders at launch"
description = "The thinnest path through every layer: dates in, reminders scheduled. The shell gains the local-notification plugin; web code calls it only after Capacitor.isPluginAvailable and reuses story 3.1's notification permission, fixture pair and simulator shell. A pure planner takes the loaded dates: each event, the person's own anniversaries, the relationship start, the wedding date and both partners' birthdays. It returns a day-before reminder for each date, and an on-the-day one for anniversaries (the wedding date and the relationship start among them) and birthdays, all at 9:00 local time, sorted and cut at the soonest 64. Reminders read 'Tomorrow: …' and 'Today: …' with the date's name: an event's or anniversary's label, each birthday as its Home card names it, 'Our anniversary' for the relationship start, 'Wedding day' for a wedding date still ahead and 'Wedding anniversary' for each year after. Anniversaries and birthdays use getNextAnniversaryDate and getNextBirthday, date strings go through parseEventDate, and the relationship start recurs on its calendar date in the device's time zone. Events come from the loaded events window (the soonest 50). On app launch, once the date copies have loaded, the app cancels all date reminders and schedules the planner's list through the plugin. Nothing is scheduled for the daily message. A person rebuilds and reinstalls the shell and runs the simulator checks with the device clock moved ahead. Hands to story 6 the planner and the cancel-and-schedule call it triggers, and to stories 2 and 3 the planner they extend. Story 5 checks the website and the Home Screen web app for R12."
verify = "Planner unit tests cover each kind of date, yearly recurrence, the wedding date before and after it passes, the on-the-day reminders, the 9:00 time and the soonest-64 cut. On a simulator with the clock moved ahead and the app launched, a day-before reminder fires for each kind of date and an on-the-day one for an anniversary and a birthday, in airplane mode; with 50 fixture events and 10 anniversaries (70 reminders) the shell holds exactly the soonest 64; the partner's device schedules nothing for an anniversary; a shell built before this epic, updated by live update, runs with no error."
covers = ["R1", "R3", "R5", "R7", "R8", "R10", "R12"]
after = ["3.1", "3.10"]
hitl = true
risk = "high"

[[entry]]
id = 6
type = "story"
title = "Reminders re-plan on every change, stop at sign-out, stack with pushes and open Home"
description = "Story 1's cancel-and-schedule call also runs on every return to the foreground, on sign-in, and whenever a date's local copy changes (the person's own edit or a partner's change arriving). Every re-plan, story 1's launch trigger included, runs only from loaded copies or a successful read, never from a copy not yet loaded or a failed read, so it never wipes reminders; stories 2 and 3 apply the rule to the copies they add. Reminders past the 64th are scheduled by a later re-plan once they move into the soonest 64. Sign-out, through deleteAccountData(), cancels every date reminder. Reminders use story 3.8's non-love-note lock-screen group. A tap arrives as the local-notification plugin's own action event, which this story listens for, behind Capacitor.isPluginAvailable, and routes to Home through the cold-start and background navigation story 3.9 built. Extends story 1's scheduling module, which story 2 also changes. A person runs the simulator checks."
verify = "Unit tests cover each trigger, the loaded-data-only rule and the sign-out cancel. On a simulator, editing a date or receiving a partner's change re-plans; with 70 reminders due, after the earliest pass and the app returns to the foreground the next ones are scheduled; a re-plan whose read fails leaves the scheduled reminders in place; reminders show in the non-love-note stack; tapping one opens Home with the app terminated and with it backgrounded on another view; after sign-out nothing is scheduled; a shell built before this epic, updated by live update, runs with no error."
covers = ["R9", "R11", "R12"]
after = [1, "3.8", "3.9"]
hitl = true
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Dates marked for the countdown remind a month and a week before"
description = "Each person marks or unmarks dates for the countdown in a list added to the shell's Settings notifications section from story 3.7, naming every date the planner covers, the partner's birthday among them. Every date starts unmarked. A mark is the person's own, kept on the account in a new RLS-protected table (policies TO authenticated, pgTAP policies_are edited in the same change) so all their devices agree and a reinstall keeps it. A mark names an event or an anniversary by its row id, and the relationship start, the wedding date, the person's birthday and the partner's birthday by a fixed key each. Marks are read offline as a new localCopy kind that deleteAccountData() removes, their store state is in signedOutState(), and a mark whose date is deleted is ignored. Under story 6's rule a re-plan waits for the marks copy to load and skips a failed read, so it never drops month and week reminders. Story 1's planner adds month-before and week-before reminders ('In a month: …', 'In a week: …') at 9:00 for marked dates and drops any whose moment has passed, and marking or unmarking re-plans. Extends story 1's planner and the scheduling module story 6 changes, and hands story 3 the Settings section with the marks list beside which its switch goes. A person runs the simulator checks."
verify = "Unit tests cover the marks' local copy, its sign-out removal and the planner's month and week reminders with past ones dropped. On a simulator, every date shows unmarked at first; a marked date fires its month, week and day-before reminders at 9:00; a date marked five days ahead schedules no month or week reminder; a mark survives a reinstall; marking on one device adds the reminders on a second at its next open; and the partner's reminders do not change."
covers = ["R2", "R4", "R5"]
after = [6, "3.7"]
hitl = true
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "A Settings switch turns date reminders off"
description = "The shell's Settings notifications section from story 3.7, with story 2's marks list, gets a date reminders switch beside the push switches, on until changed and stored with them in story 3.7's table, and read offline at launch as part of a localCopy kind so the planner honours it without a connection. Under story 6's rule a re-plan waits for the switch's copy to load and skips a failed read, so it never schedules reminders for someone who switched them off. Turning it off cancels every date reminder, turning it on re-plans, and story 1's planner schedules nothing while it is off. Its store state is in signedOutState(). The website, the Home Screen web app and older shells show no switch. Extends story 1's planner and the Settings section story 2 changes."
verify = "On a simulator, turning the switch off leaves no date reminder scheduled and turning it on restores them, the setting survives a reinstall, and a second device of the same account honours it at its next open; unit tests cover the switch and the planner's off state."
covers = ["R6"]
after = [2]
hitl = true
risk = "low"


[[entry]]
id = 5
type = "story"
title = "Date reminders ship to the owner's iPhone"
description = "deploy.yml ships the migrations and the site, and a person installs a shell built from this epic on the owner's iPhone, after epic-push-notifications' ship story has installed its own. They run each Done when check with the fictional fixture accounts against production, moving the device clock ahead, and update a shell built before this epic by live update to confirm it, the website and the Home Screen web app still work."
verify = "On the owner's iPhone against production, with the clock moved ahead, each kind of date reminds the day before at 9:00, in airplane mode too, marked dates add the month and week reminders, anniversaries and birthdays remind on the day, nothing names the daily message, the partner's iPhone or simulator schedules nothing for the owner's anniversary, tapping a reminder opens Home from a cold start and from the background, the switch off leaves none scheduled, and sign-out leaves none; an older shell updated by live update, the website and the Home Screen web app run with no error; CI is green on main."
covers = ["R1", "R2", "R3", "R4", "R5", "R6", "R7", "R8", "R9", "R10", "R11", "R12"]
after = [4, "3.11"]
hitl = true
risk = "medium"

# The epic's stories in build order.

[[entry]]
id = 7
type = "story"
title = "The simulator driver lists an app's scheduled reminders"
description = "Extends story 2.9's simulator driver, after story 3.12's notification steps (both change the driver and its host app), with a reader for the simulator's pending local notifications, which iOS keeps on the Mac's file system: ~/Library/Developer/CoreSimulator/Devices/<udid>/data/Library/UserNotifications/<folder>/PendingNotifications.plist, an NSKeyedArchiver archive, with Library.plist in UserNotifications mapping folders to bundle ids. It lists, for a simulator and a bundle id, each pending request's identifier, title, body, thread id and trigger (calendar date components or interval). The format is private and undocumented and can change between iOS releases, so the reader is proven against requests the driver's own host app schedules, a one-off dated 9:00 request and a yearly repeating 9:00 request among them, since another session read only an interval trigger. Hands stories 1, 6, 2 and 3 the scheduled-list check."
verify = "With no person acting, on the iPhone Duo simulator the driver's host app schedules an interval request, a one-off calendar request at 9:00 on a given date and a yearly repeating calendar request at 9:00, with known titles, bodies and thread ids, and the reader lists both with those values and triggers; after the host app removes one, the reader lists only the other."
covers = []
after = ["2.9", "2.4", "3.12", "3.10"]
hitl = false
risk = "high"

[[entry]]
id = 1
type = "story"
title = "The planner schedules every date's day-before and on-the-day reminders at launch"
description = "The thinnest path through every layer: dates in, reminders scheduled. The shell gains the local-notification plugin; web code calls it only after Capacitor.isPluginAvailable and reuses story 3.1's notification permission and story 2.9's fixture pair and simulator shell. A pure planner takes the loaded dates: each event, the person's own anniversaries, the relationship start, the wedding date and both partners' birthdays. It returns a day-before reminder for each date, and an on-the-day one for anniversaries (the wedding date and the relationship start among them) and birthdays, all at 9:00 local time, drops any whose moment has passed (an event today, or tomorrow once 9:00 has passed), and sorts and cuts the rest at the soonest 64. Reminders read 'Tomorrow: …' and 'Today: …' with the date's name: an event's or anniversary's label, each birthday as its Home card names it ('Tomorrow: Casey turns 30', and 'Tomorrow: You turn 30' for the person's own, from BirthdayCountdown's '{name} turns {age}' and 'You turn {age}'), 'Our anniversary' for the relationship start, 'Wedding day' for a wedding date still ahead and 'Wedding anniversary' for each year after. Anniversaries and birthdays use getNextAnniversaryDate and getNextBirthday, which is exported from BirthdayCountdown.tsx (or moved to a shared module) with the card's behaviour unchanged, date strings go through parseEventDate, and the relationship start recurs on its calendar date in the device's time zone. Events come from the loaded events window (the soonest 50). On app launch, once the date copies have loaded, the app cancels all date reminders and schedules the planner's list through the plugin; when done, a day-before reminder for each kind of date sits in the shell's scheduled list. Nothing is scheduled for the daily message. The simulator checks run through story 2.9's driver (story 3.12's step taps the permission alert) and story 7's scheduled-list reader against the local stack, with no person; reminders firing are story 8's. It seeds and afterwards removes the fixture pair's dates for its checks, since story 2.9's pair is shared. Hands to story 6 the planner and the cancel-and-schedule call it triggers, and to stories 2 and 3 the planner they extend. Story 5 checks the website and the Home Screen web app for R12."
verify = "Planner unit tests cover each kind of date, the birthday texts, dropping a reminder whose moment has passed, yearly recurrence, the wedding date before and after it passes, the on-the-day reminders, the 9:00 time and the soonest-64 cut. Through the driver on the simulator, after launch with the network off once the date copies have loaded, story 7's reader lists a day-before reminder for each kind of date and an on-the-day one for an anniversary and a birthday, each with its text and a 9:00 calendar trigger, and none naming the daily message; with 50 fixture events and 10 anniversaries and no other date set (70 reminders) it lists exactly the soonest 64; signed in as the partner, it lists nothing for the first account's anniversary; a shell built before this epic, updated by live update, runs with no error."
covers = ["R1", "R3", "R5", "R7", "R8", "R10", "R12"]
after = [7, "3.1", "3.10"]
hitl = false
risk = "high"

[[entry]]
id = 6
type = "story"
title = "Reminders re-plan on every change, stop at sign-out, stack with pushes and open Home"
description = "Story 1's cancel-and-schedule call also runs on every return to the foreground, on sign-in, and whenever a date's local copy changes (the person's own edit or a partner's change arriving). Every re-plan, story 1's launch trigger included, runs only from loaded copies or a successful read, never from a copy not yet loaded or a failed read, so it never wipes reminders; stories 2 and 3 apply the rule to the copies they add. Reminders past the 64th are scheduled by a later re-plan once they move into the soonest 64. Sign-out, through deleteAccountData(), cancels every date reminder. Reminders use story 3.8's non-love-note lock-screen group. A tap arrives as the local-notification plugin's own action event, which this story listens for, behind Capacitor.isPluginAvailable, and routes to Home through the cold-start and background navigation story 3.9 built. Extends story 1's scheduling module, which story 2 also changes. The simulator checks run through story 2.9's driver and story 7's reader, with no person; a reminder's tap and the soonest-64 cut moving on as reminders pass are checked by story 8, because both need a reminder to fire."
verify = "Unit tests cover each trigger, the loaded-data-only rule, the sign-out cancel, the soonest-64 cut moving on once the earliest pass, and the tap's route to Home. Through the driver on the simulator, story 7's reader shows the list re-planned after editing a date, after a partner's change arrives and after a return to the foreground; a re-plan whose read fails leaves the list in place; every listed reminder carries story 3.8's non-love-note group as its thread id; after sign-out the list is empty; a shell built before this epic, updated by live update, runs with no error."
covers = ["R9", "R11", "R12"]
after = [1, "3.8", "3.9"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Dates marked for the countdown remind a month and a week before"
description = "Each person marks or unmarks dates for the countdown in a list added to the shell's Settings 'Push and reminders' section from story 3.7, placed by that section's layout rules in epic-push-notifications' Notes, naming every date the planner covers, the partner's birthday among them. Every date starts unmarked. The website, the Home Screen web app and older shells show no marks list. A mark is the person's own, kept on the account in a new RLS-protected table (policies TO authenticated, pgTAP policies_are edited in the same change) so all their devices agree and a reinstall keeps it. A mark names an event or an anniversary by its row id, and the relationship start, the wedding date, the person's birthday and the partner's birthday by a fixed key each. Marks are read offline as a new localCopy kind that deleteAccountData() removes, their store state is in signedOutState(), and a mark whose date is deleted is ignored. Under story 6's rule a re-plan waits for the marks copy to load and skips a failed read, so it never drops month and week reminders. Story 1's planner adds month-before and week-before reminders ('In a month: …', 'In a week: …') at 9:00 for marked dates and drops any whose moment has passed, and marking or unmarking re-plans. Extends story 1's planner and the scheduling module story 6 changes, and hands story 3 the Settings section with the marks list beside which its switch goes. The simulator checks run through story 2.9's driver and story 7's reader, with no person; it owns the second simulator signed in to the same account (a simctl clone or another iPhone simulator), which story 3 reuses; the month and week reminders firing are story 8's."
verify = "Unit tests cover the marks' local copy, its sign-out removal and the planner's month and week reminders with past ones dropped. Through the driver on the simulator, every date shows unmarked at first; marking a date adds its month-before and week-before reminders at 9:00 beside its day-before one in story 7's list; a date marked five days ahead lists no month or week reminder; a mark survives an uninstall and reinstall; a launch with the network off still lists the marked date's month and week reminders; an E2E spec shows the website has no marks list; marking on one simulator adds the reminders on a second simulator signed in to the same account at its next open; and the partner's list does not change."
covers = ["R2", "R4", "R5"]
after = [6, "3.7"]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "A Settings switch turns date reminders off"
description = "The shell's Settings 'Push and reminders' section from story 3.7, with story 2's marks list, gets a date reminders switch, placed by that section's layout rules in epic-push-notifications' Notes, beside the push switches, on until changed and stored with them in story 3.7's table, and read offline at launch from a new localCopy kind holding that row (removed by deleteAccountData()), so the planner honours it without a connection. Under story 6's rule a re-plan waits for the switch's copy to load and skips a failed read, so it never schedules reminders for someone who switched them off. Turning it off cancels every date reminder, turning it on re-plans, and story 1's planner schedules nothing while it is off. Its store state is in signedOutState(). The website, the Home Screen web app and older shells show no switch. Extends story 1's planner and the Settings section story 2 changes. The simulator checks run through story 2.9's driver and story 7's reader, with no person."
verify = "Unit tests cover the switch and the planner's off state; through the driver on the simulator, a fresh account starts with the switch on; turning the switch off empties story 7's list and turning it on restores it; a launch with the network off and the switch off schedules nothing; the setting survives an uninstall and reinstall, and a second simulator signed in to the same account honours it at its next open."
covers = ["R6"]
after = [2]
hitl = false
risk = "low"

[[entry]]
id = 8
type = "story"
title = "Reminders fire at 9:00 and a tap opens Home"
description = "The checks that need a reminder to fire, which no session can make unattended because a simulator's clock follows the Mac's: a person moves the simulator's clock ahead through the Mac's (no shell with the plugin goes on a device before story 5) and watches stories 1, 6, 2 and 3's reminders fire. Each kind of date's day-before reminder fires at 9:00, with the network off too; a marked date's month and week reminders and an anniversary's and a birthday's on-the-day reminder fire; reminders stack with the non-love-note pushes; tapping one opens Home from a cold start and from the background; and with 70 reminders due, once the earliest pass and the app returns to the foreground, the next ones are scheduled. Uses the shell built from stories 1, 6, 2 and 3 against the local stack and its fixture accounts. Fixes found here belong to this story; the clock is set back afterwards."
verify = "With the clock moved ahead, each kind of date's day-before reminder fires at 9:00 with the network off, a marked date's month and week reminders and the on-the-day reminders for an anniversary and a birthday fire, the reminders show in the non-love-note group, a tap opens Home with the app terminated and with it backgrounded on another view, and with 70 due the next ones are scheduled after the earliest pass and a return to the foreground; the clock is back to real time at the end."
covers = ["R1", "R2", "R3", "R5", "R7", "R11"]
after = [3]
hitl = true
risk = "medium"


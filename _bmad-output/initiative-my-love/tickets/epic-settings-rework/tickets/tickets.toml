# Epic 5, Settings Rework: every planned story in build order.
# Settings.tsx, the slices it reads and the old date sections form one ordered
# lane, so most entries wait on the one before; the edge-swipe spike and its
# build are the only side lane.
# R16, R17 and R18 (touch targets, states, design) are delivered by each story
# for the pages it adds or changes.
# Every story updates the existing E2E specs and helpers its change breaks
# (tests/e2e/settings, the sign-out helpers, "Sign out" text) in the same
# story, so main stays green.

[[entry]]
id = 1
type = "story"
title = "Settings opens as a stack of pages with the new top page"
description = "Builds the page stack every later story adds to: Settings' own bar (large title collapsing on scroll, small title on single-item pages), one pushState entry per page under the /settings/ scheme in the epic's Notes, a list page reloading to itself, the first-entry back rule, the slide (fade under Reduce Motion) and focus moves; the top page's groups with the Photos row and Photos page, Replay welcome message and the two log-out rows moved into their cards; removes the old Photos section (Settings.tsx:794); adds the AGENTS.md rule for adding a Settings subpage. Old sections not yet replaced stay below the rows until their stories move them."
verify = "On npm run dev:local, Settings opens on the new top page; tapping Photos slides in the Photos page, the choice saves offline, a reload stays on it, and the back arrow and browser back each return one level, in both dock forms."
covers = ["R1", "R2", "R12", "R16", "R17", "R18"]
after = ["2.8"]
hitl = false
risk = "high"

[[entry]]
id = 2
type = "spike"
title = "Find how the edge swipe returns one level in the shell"
description = "Decides between the native WKWebView back-forward gesture (allowsBackForwardNavigationGestures, a reinstall on both phones) and a web gesture, by trying the native one against story 1's pushState entries; records whether the native gesture also goes back across views outside Settings, since it applies app-wide. A device trial uses AGENTS.md's build-number procedure, never an uninstall. Also finds whether the simulator driver can swipe: if so it adds a sim swipe command for story 15, if not story 15's check becomes a hand check. Records the choice as a Decision in the epic's Notes."
verify = "The epic's Notes hold a dated Decision naming native or web, with what was tried and seen, and whether sim swipe exists."
covers = ["R2"]
after = [1]
hitl = true
risk = "high"

[[entry]]
id = 3
type = "story"
title = "Settings state splits into dates, profile and notifications slices"
description = "Splits settingsSlice.ts by domain as the epic's Notes decide: datesSlice (anniversaries, couple settings, countdown marks), profileSlice (own profile, with the display name moved in from Settings.tsx's local lookup, giving R4 its one name store), notificationsSlice (push preferences), each with its copy kind, reader and refresher; signedOutState covers every moved field; AGENTS.md's slice count is updated. No visible change."
verify = "The unit and E2E suites pass with only import paths changed, sign-out still clears every moved field (signOutClearsAccountState), and settingsSlice.ts holds only start-up, device settings and onboarding."
covers = ["R15", "R4"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Adding or changing a date sends no push"
description = "First DW-416 deploy: a migration drops the five date triggers, notify_date_change, date_changes and push_requests.date_change_id (with the source check) after a read-only check of the hosted catalog; send-push loses its date kind; the client stops reading and writing the dates preference (PUSH_PREFERENCE_KEYS, the service's column list, the Dates switch, the date tap route); pgTAP pins, database.types.ts and scripts/sim-driver/README.md (its sim dates line about date-change pushes) follow. push_preferences.dates stays for story 18."
verify = "On a linked local stack, adding or changing an event, the wedding date, Together since or a birthday creates no push_requests row, supabase test db and the send-push Deno tests pass, and push settings still load and save."
covers = ["R14"]
after = [3, "3.5", "3.6", "3.9"]
hitl = false
risk = "medium"


<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Lora:ital,wght@1,500;1,600&amp;family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&amp;family=Cormorant+Garamond:ital,wght@1,500;1,600&amp;family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif}
.dark{--page:#0b0e14;--card:#141925;--card2:#1c2230;--ink:#f3f4f6;--muted:#9aa3b2;--accent:#f472b6;--fill:#db2777;--on-fill:#ffffff;--tint:rgba(244,114,182,.14);--partner:#a78bfa;--ptint:rgba(167,139,250,.16);--good:#4ade80;--gtint:rgba(74,222,128,.12);--danger:#f87171;--dtint:rgba(248,113,113,.12);--line:rgba(255,255,255,.07);--glass:rgba(17,21,30,.78);--shadow:0 1px 0 rgba(255,255,255,.03) inset;--float:0 10px 30px rgba(0,0,0,.5);--field:#0f131b}
.light{--page:#fdf4f7;--card:#ffffff;--card2:#f6eef2;--ink:#1f2430;--muted:#6b7280;--accent:#db2777;--fill:#db2777;--on-fill:#ffffff;--tint:#fce7f3;--partner:#7c3aed;--ptint:#f1eafe;--good:#15803d;--gtint:#e7f6ec;--danger:#dc2626;--dtint:#fdecec;--line:rgba(157,23,77,.09);--glass:rgba(255,255,255,.8);--shadow:0 1px 2px rgba(157,23,77,.05), 0 8px 24px rgba(157,23,77,.06);--float:0 10px 30px rgba(157,23,77,.16);--field:#fbf7f9}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--page); font-family: Inter, system-ui, sans-serif; color: var(--ink);">
<div style="height: 100%; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 28px; padding: 24px 20px;">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
<div style="display: flex; align-items: center; justify-content: center; gap: 11px;"><span style="color: var(--accent); display: flex;"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg></span><span style="font-family: 'Lora', serif; font-style: italic; font-size: 34px; font-weight: 600; line-height: 1; color: var(--ink);">My Love</span></div>
<div style="font-size: 15px; color: var(--muted);">Welcome back &#8212; sign in to continue</div></div>
<div style="background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; "><label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink);">Email<input type="email" placeholder="you@example.com" style="height: 48px; box-sizing: border-box; border-radius: 14px; border: 0; box-shadow: inset 0 0 0 1px var(--line); background: var(--field); color: var(--ink); padding: 0 14px; font: 15px Inter, sans-serif;"></label><label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink);">Password<input type="password" placeholder="Your password" style="height: 48px; box-sizing: border-box; border-radius: 14px; border: 0; box-shadow: inset 0 0 0 1px var(--line); background: var(--field); color: var(--ink); padding: 0 14px; font: 15px Inter, sans-serif;"></label><div style="height: 4px;"></div><button type="button" style="width: 100%; height: 48px; padding: 0 22px; border: 0; border-radius: 999px; background: var(--fill); color: var(--on-fill); font: 600 15px Inter, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;">Sign in</button><div style="display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .08em;"><div style="flex-grow: 1; height: 1px; background: var(--line);"></div>OR<div style="flex-grow: 1; height: 1px; background: var(--line);"></div></div><button type="button" style="height: 48px; border: 0; border-radius: 999px; background: var(--card2); color: var(--ink); font: 600 15px Inter, sans-serif; cursor: pointer;">Continue with Google</button></div>
<div style="text-align: center; font-size: 14px; color: var(--muted);">Need an account? <a href="#" style="font-weight: 600;">Contact admin</a></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": true}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
renderVals() {
return { themeClass: (this.props.dark ?? true) ? 'dark' : 'light' };
}
}
</script>
</body>
</html>

- id: "1"
  title: Style kit foundation and chrome
  description: >-
    Define every token in design-tokens.md in src/index.css as Tailwind
    utilities with dark values, theme the page ground, load Lora, and restyle
    AppNavigation (heart + Lora wordmark, glass bar and dock). Covers CAP-1's
    foundation, CAP-2's ground and CAP-10's wordmark.
  invoke_dev_with: >-
    Requires spec-bottom-dock-navigation merged. Leave Dancing Script and the
    old index.css classes in place until story 9 so unmigrated screens keep
    rendering.
- id: "2"
  title: Home on the kit
  description: >-
    Uniform countdown cards, the daily-message card in Lora Italic, the
    Upcoming label and kit placeholders, and removal of the floating
    WelcomeButton, per screens.md Home. Covers CAP-3.
  invoke_dev_with: >-
    Match mockups/Home.dc.html. Removing WelcomeButton must not strand the
    splash: story 7 adds the Settings replay row, so keep WelcomeSplash and
    App's onShowWelcome wiring intact.
- id: "3"
  title: Mood on the kit
  description: >-
    Mood title, segmented control, partner-mood violet chips, tile grid, the
    history calendar, timeline and detail modal, with a single shared mood
    icon/colour map. Covers CAP-4 and CAP-2 for Mood.
  invoke_dev_with: Match mockups/Mood.dc.html.
- id: "4"
  title: Love Notes on the kit
  description: >-
    Remove the in-view header bar, add the partner row, and restyle bubbles,
    composer, empty state, remove-note dialog and full-screen image viewer.
    Covers CAP-5 and CAP-2 for Love Notes.
  invoke_dev_with: >-
    Match mockups/Notes.dc.html. LoveNotes height math depends on
    --dock-clearance from the dock spec; keep the page from scrolling at
    390x844.
- id: "5"
  title: Partner on the kit
  description: >-
    Fix the horizontal overflow and rebuild the Partner header, current-mood
    card, Poke/Kiss/Fart action tiles with History, recent moods and the
    interaction history sheet. Covers CAP-6 and CAP-2 for Partner.
  invoke_dev_with: >-
    Match mockups/Partner.dc.html. Add an E2E assertion that scrollWidth
    equals clientWidth on Partner at 390px.
- id: "6"
  title: Photos on the kit
  description: >-
    Titled grid with the header Upload button replacing the FAB, owner badges,
    skeleton column fix, empty state only at zero photos, and one dialog
    pattern for upload, viewer, carousel, edit and delete. Covers CAP-7 and
    CAP-11 for photo dialogs.
  invoke_dev_with: >-
    Match mockups/Photos.dc.html in both hasPhotos states. The upload
    button keeps the FAB's testid.
- id: "7"
  title: Settings on the kit
  description: >-
    Grouped list cards, Countdowns group without duplicate headings, Events and
    Anniversary modals on the kit dialog, the Replay welcome message row, and a
    quiet Sign out row; delete Settings.css. Covers CAP-8.
  invoke_dev_with: Match mockups/Settings.dc.html.
- id: "8"
  title: Sign in and remaining surfaces
  description: >-
    Sign in per its artboard, then DisplayNameSetup, WelcomeSplash, error
    boundaries, SyncToast and NetworkStatusIndicator on the kit; delete
    LoginScreen.css and DisplayNameSetup.css. Covers CAP-9 and the rest of
    CAP-11.
  invoke_dev_with: Match mockups/SignIn.dc.html; the rest follow design-tokens.md.
- id: "9"
  title: Cleanup and consistency sweep
  description: >-
    Remove the Dancing Script import, unused index.css component classes and
    unused tailwind colour scales, delete components left unused, and run the
    Success signal grep and both-theme screenshots. Closes CAP-1, CAP-2 and
    CAP-10.
  invoke_dev_with: >-
    Deleting a source file needs it to be unreferenced first (grep imports).
    Report any leftover hex or gradient the grep finds instead of silently
    whitelisting it.

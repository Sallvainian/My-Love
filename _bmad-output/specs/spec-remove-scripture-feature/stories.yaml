- id: "1"
  title: Leftover scripture test-infrastructure surgery
  description: >-
    Remove the leftover scripture fixtures and helpers, repair the shared
    test files that still import them, and rewrite the integration example
    against events. Dedicated E2E/API suites are already gone. Covers the
    remaining CAP-3 work and must not touch tests/api/.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Read removal-inventory.md sections 0, 1 (Tests) and 2.1 / 2.4 before starting.
    Line numbers are 2026-09-15 against main; re-grep if the branch has moved.

    THIS STORY IS LEFTOVER SHARED-FILE SURGERY ONLY.
    Do NOT delete tests/e2e/scripture/ — the directory is already gone (820be2d2).
    Do NOT touch tests/api/ — 16 live non-scripture specs (events, interactions,
    auth, uploads). Do NOT delete anything under tests/e2e-archive/.
    Do NOT delete tests/support/helpers/rls-security.ts — it has live importers
    in tests/api/ and tests/e2e/auth/. The 2026-08-19 orphan delete is superseded.

    HARD ORDERING RULE: tests/support/merged-fixtures.ts lines 21, 23, 66, 68,
    82 and 84 must be edited in the SAME commit that deletes
    fixtures/scripture-navigation.ts and fixtures/together-mode.ts. 59 files
    import that barrel; every remaining importer is non-scripture.

    Three things that will not announce themselves:
    - tests/e2e/navigation/tray.spec.ts:82 has 'scripture' in a loop asserting
      .not.toHaveAttribute. A stale entry passes VACUOUSLY against a testid that
      no longer exists — a silent false-green, not a failure. Remove it.
    - tests/support/helpers.ts (the flat 679-line file) is 100% scripture and is
      deleted. tests/support/helpers/index.ts (the directory barrel) is
      domain-neutral and MUST STAY. Same import root, opposite verdicts.
    - In tests/support/factories/index.ts keep TypedSupabaseClient (line 16) and
      in tests/support/fixtures/index.ts keep supabaseAdmin (47, 73).

    REWRITE, DO NOT DELETE: tests/integration/example-rpc.spec.ts. The directory
    also holds claude-bot-config-forward-migration.spec.ts; do not leave it empty.
    Same shape — seed through the admin client, assert the rows, clean up — but
    targeting events instead of scripture_seed_test_data. Sallvain approved
    the rewrite on 2026-08-19.

    Also: rewrite tests/README.md's stale scripture/ tree; reword comments that
    cite together-mode.ts / scripture-cache.ts in live non-api specs
    (love-notes-realtime, partner-mood-realtime, persisted-blob, auth fixture).
    Leave tests/api/ comment citations of deleted scripture files alone.

    Do NOT touch src/ or supabase/ in this story.

    Verify with: npm run typecheck && npm run lint && npx playwright test --project=chromium

- id: "2"
  title: Remove scripture from the application
  description: >-
    Delete the scripture component directory, dedicated hooks, service and
    store slice, then perform the surgery on the shared src files that
    reference them. Covers CAP-1 plus the app-side half of CAP-3. Component
    and scripture-named unit tests are already gone.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Read removal-inventory.md sections 1 (App code) and 2.2 before starting.
    Line numbers are 2026-09-15 against main; re-grep if the branch has moved.

    Do NOT try to delete the component tests under
    src/components/scripture-reading/__tests__/ or the 15 scripture-named
    unit files — 820be2d2 already removed them. DO delete the three test
    files still on disk that travel with this story: src/hooks/__tests__/useMotionConfig.test.ts,
    tests/unit/hooks/useAutoSave.test.ts, tests/unit/validation/schemas.test.ts.

    Two atomic pairs — either half alone is a compile error or a leak:
    - navigationSlice.ts:25 (ViewType union member) with :58 (pathMap entry).
      pathMap is Record<ViewType, string>, so it is exhaustive.
    - authSlice.ts signedOutState() 119-144 with the EXPECTED_RESET constant in
      tests/unit/stores/signOutClearsAccountState.test.ts:69-88 (NOT an inner
      slice — line 69 `session: null,` and line 88 `isInitialized: false,` are
      both scripture-owned). Key-parity assertion is now at :694.

    TRAP in authSlice.ts: of the fields to delete, EIGHT are named partner*/my*
    but are scripture-owned — myRole, partnerJoined, myReady, partnerReady,
    partnerLocked, partnerDisconnected, partnerDisconnectedAt, countdownStartedAt
    (134-141). partnerSlice owns NONE of them. Work from the quoted line range.

    TRAP: src/hooks/useAutoSave.ts and src/hooks/useMotionConfig.ts have generic
    names and live in the shared hooks directory but are 100% scripture —
    verified zero non-scripture production importers. Delete both plus their
    test files. Leaving useAutoSave.ts behind breaks the build.

    RETARGET, DO NOT DELETE: NavigationTray.test.tsx:132-142 is the only test
    covering "selecting a destination reports the view and closes the tray"
    and it happens to click scripture. Point it at a surviving destination.

    PRESERVE: src/hooks/useFocusTrap.ts — only its comment at 84-89 changes,
    and line 87 is mid-sentence so reword 85-88 as a unit.
    In src/services/eventsService.ts:627 a non-scripture feature documents a
    real postgrest-js typing constraint by pointing at scriptureReadingService.ts;
    inline that explanation rather than lose it.

    NAME COLLISION: SupabaseMessageSchema exists in BOTH src/validation/schemas.ts
    (scripture messages, delete with the 197-260 tail) and
    src/api/validation/supabaseSchemas.ts:193 (love messages, keep). Delete
    CoupleStatsSchema at 252-265 and the CoupleStats type at 283; keep TimestampSchema.

    Also strip the scripture eslint.config.js selectors (104-116) and the two
    scripture-only override blocks (178-227). Do not drop the src/ zod
    no-restricted-imports block at 159-177.

    Leave src/services/dbSchema.ts and src/types/database.types.ts entirely alone —
    they are stories 4 and 3.

    Verify with: npm run typecheck && npm run lint && npm run test:ci-local

- id: "3"
  title: Drop the scripture database objects
  description: >-
    Add a forward migration dropping the 5 tables, 12 functions, 1 trigger,
    4 enum types and 4 realtime.messages policies, delete the two remaining
    scripture pgTAP files, repair the shared ones, add policy coverage for
    two surviving tables, and regenerate the types. Covers CAP-2 and the
    FN-GRANT-008 / couple-broadcast half of CAP-4.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Read removal-inventory.md section 3 and 4.1 / 4.5 before starting.

    THIS IS THE ONLY IRREVERSIBLE STORY, AND IT IS DELIBERATELY UNGATED.
    A production query on 2026-08-19 found 64 sessions (only 2 ever completed),
    18 step states, 5 reflections, 3 bookmarks, 0 messages — including 2 shared
    scripture reflections written by Sallvain and their partner on 2026-03-13.
    Sallvain was shown these figures, was offered a one-time export, and declined
    it on 2026-08-19: "you don't need to export those. I'm not using the scripture
    feature anymore." Proceed and destroy the data. Do not re-litigate this and do
    not pause to re-ask.

    DO NOT DELETE ANY FILE UNDER supabase/migrations/. Surviving migration
    20260818000000 lines 271-294 grants EXECUTE on scripture functions; deleting
    the creating migrations makes a fresh `supabase db reset` fail with 42883.
    Add ONE new forward migration ordered AFTER 20260912030000_profile_name_email_ownership.sql.
    The August slot "immediately after 20260818000001" is taken by
    20260818000002_create_events_table.sql. Section 3.2 has the exact signatures.

    ALSO DROP the four realtime.messages policies (they will not fall off with
    DROP TABLE): scripture_session_members_can_receive_broadcasts,
    scripture_session_members_can_send_broadcasts,
    scripture_presence_members_can_receive_broadcasts,
    scripture_presence_members_can_send_broadcasts.
    In the same commit, shrink 23_couple_broadcast_policies.sql:25-37 to the two
    couple policies only.

    The 12 dedicated pgTAP files are already gone. Delete the two that remain:
    01_schema.sql and 02_rls_policies.sql.

    HIGHEST-VALUE EDIT: supabase/tests/database/18_function_execute_grants.sql
    FN-GRANT-008 at lines 128-132 is an exact-set assertion listing 13 function
    names, 10 of them scripture. It must become exactly:
      'accept_partner_request, decline_partner_request, get_my_partner_id',
    Re-read 2026-09-15: that remainder is still exact. In the same file also
    delete FN-GRANT-003/004 (93-103) and FN-GRANT-007 (158-161), then renumber
    `select plan(21);` at line 29 to `plan(18)`. has_function_privilege with a
    text signature ERRORS (42883) on a missing function rather than returning false.

    In supabase/tests/database/00_helpers.sql delete only tests.create_session_as_admin
    (65-90). KEEP create_test_user/authenticate_as/reset_role (16-59).

    ADD NEW COVERAGE (Sallvain approved 2026-08-19): a new pgTAP file asserting
    the policy set for love_notes and users. Re-read the local policy names with
    `select policyname from pg_policies where tablename in ('love_notes','users')`
    after `supabase db reset` and assert THOSE. 25_profile_name_email_ownership.sql:28-31
    still notes that no file pins the users policy set. If local and production
    disagree, stop and report the drift rather than papering over it.

    NEVER hand-edit src/types/database.types.ts (AGENTS.md policy). Drop first,
    then regenerate:
      supabase gen types typescript --local | grep -v '^Connecting to' > src/types/database.types.ts
    The 4 scripture enums are still the only entries in public.Enums, so that
    block correctly becomes [_ in never]: never after regeneration.

    Verify with: supabase db reset && supabase test db && npm run typecheck

- id: "4"
  title: Remove the scripture IndexedDB object stores
  description: >-
    Strip the scripture types, schema members and creation branches from
    dbSchema.ts, bump DB_VERSION from 9 to 10 with a deleteObjectStore pass,
    and handle the service-worker blocked event. Covers CAP-5 and the
    remaining CAP-4 assertions.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Read removal-inventory.md sections 2.3, 4.2, 4.3 and 4.4 before starting.
    Line numbers are 2026-09-15 against main; re-grep if the branch has moved.

    The four scripture-only stores are scripture-sessions, scripture-reflections,
    scripture-bookmarks and scripture-messages. Survivors are messages,
    message-favorites, photos, moods and sw-auth — FIVE, not four.

    deleteObjectStore must go through idb's unwrap() — already imported at
    dbSchema.ts:2 — because the typed wrapper cannot name a store that is no
    longer in MyLoveDBSchema.

    ASSERTION TRAP in tests/unit/services/dbSchema.test.ts — do NOT reuse the
    August toBe(8)→4 / toBe(7)→8 instructions:
      :73  toBe(9)  -> becomes 5
      :106 toBe(4)  -> DO NOT TOUCH (v4 pre-scripture count)
      :127 toBe(9)  -> deleted with its it (78-128). Do NOT wholesale-delete
           describe('upgrade from v4 to v5') at 77 — the it at 130 (messages
           by-user index) is surviving functionality.
      :344 toBe(9)  -> becomes 5; strip the four getAll('scripture-*') expects
           at 335-340; do not delete the v7-to-v8 it
      :488 expect(DB_VERSION).toBe(9) -> becomes 10
    A blind replace of toBe(9) is itself the bug: it is both a store count (→5)
    and the version assertion (→10).

    In tests/unit/services/storageSchema.test.ts remove only ALL_STORES entries
    30-33 (the four scripture names). Keep message-favorites at line 26.

    EXPECTED_RESET scripture keys are now 69-88 (not August's 66-85). Pair with
    authSlice.ts:119-144. Key-parity is at :694.

    AMEND, DO NOT DELETE, the version-history comments at dbSchema.ts:111,
    195-207 and 244-250. The 244-250 paragraph is the design rationale for the
    existence-check pattern that every SURVIVING store depends on.

    REQUIRED: add a `blocked` handler on the openDB call. src/sw-db.ts:27 opens
    my-love-db independently with its own DB_VERSION, so a service worker still
    on v9 blocks the v10 upgrade. Surface a clear reload prompt; do not let the
    app hang or fail silently. This was an explicit product decision (2026-08-19).

    Verify with: npm run typecheck && npm run lint && npm run test:ci-local

- id: "5"
  title: Right-size the CI E2E shard count
  description: >-
    Measure the post-removal E2E timings from a green run after stories 1–4
    and choose a shard count from those numbers, recording the decision
    beside the existing rationale in test.yml. Covers CAP-6. The dedicated-test
    CI win is already banked.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Read ci-baseline.md before starting, and follow its "How to verify" steps.

    MEASURE FIRST. Do not pick a shard count from the August ~220s estimate —
    that arithmetic assumed ~76 surviving tests and is historical. Replacing
    it with a real number is the entire point of this story.

    Historical baseline to record against: worst E2E shard 381s (177s Supabase
    setup + 174s tests) on run 32279178457, when 144 of 220 E2E tests were
    scripture. Those specs are already gone (820be2d2). The dedicated-test CI
    win is already banked. CAP-6 measures a green run after stories 1–4
    against the suite that remains (37 spec files / 107 test( matches on
    2026-09-15 main, plus whatever stories 1–4 left in place).

    Every job still pays a 130-177s Supabase startup floor that this work
    cannot move. Confirm from the measured run before acting on fewer shards.

    Do NOT touch the burn-in job or .github/actions/setup-supabase/action.yml —
    both are explicit SPEC non-goals. DO rewrite the burn-in comment at
    test.yml:414 that still names deleted scripture spec files, and the stale
    playwright.config.ts:102-105 comment about scripture specs sorting into
    one contiguous block.

    Record the new numbers in ci-baseline.md and the decision in test.yml beside
    the existing comment at lines 343-347 (moved from August's 231-235), which
    is the precedent for how this project documents a sharding choice.

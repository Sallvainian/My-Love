- id: "1"
  title: Shared per-account local-copy foundation
  description: >-
    Build the one local-copy mechanism every data kind will use: a per-account
    store, render-then-refresh reads, and refresh on start, reconnect and
    Realtime (CAP-1, CAP-2). Sign-out deletes the account's copies but keeps
    unsent writes (CAP-7), plus the shared offline indicator (CAP-8). Migrate
    no feature yet beyond one proving consumer.
  spec_checkpoint: true
  done_checkpoint: true
- id: "2"
  title: "Anniversaries onto the foundation; mirrors refresh on reconnect"
  description: >-
    Put anniversaries on the shared mechanism and retire anniversaryVault.ts
    (CAP-1). Custom messages and favorites refresh on reconnect as well as
    sign-in and are deleted at sign-out (CAP-2, CAP-7); their storage moves in
    story 12.
- id: "3"
  title: Couple settings on the server
  description: >-
    Store the relationship start date on the server, shared by both partners
    and editable in Settings (CAP-9). Name the partner only from their display
    name, fixing the mood pop-up's hard-coded name (CAP-10). Home's "Together
    for" card reads the shared start date instead of relationshipDates.ts, and
    the unused notification-time settings go; the birthday cards keep their
    names until story 4.
- id: "4"
  title: Birthdays and wedding date on the server
  description: >-
    Each partner sets their own birthday in Settings, saved on their account,
    and the wedding date is a shared couple setting either partner can edit
    (CAP-11). Home's birthday and wedding cards read these, and
    relationshipDates.ts is removed.
- id: "5"
  title: Events offline
  description: >-
    Events render from the local copy and refresh from the server (CAP-1). The
    partner profile moved onto the local copy in story 1.
- id: "6"
  title: Mood history from the server, partner mood cached
  description: >-
    A new device fills its own mood history from the server (CAP-6). The
    partner's moods render from the local copy offline (CAP-1). The existing
    offline mood queue and its Background Sync keep working.
- id: "7"
  title: Poke and kiss history offline
  description: >-
    The interaction history renders from the local copy and refreshes on
    reconnect and on incoming Realtime events (CAP-1, CAP-2). Sending still
    needs a connection.
- id: "8"
  title: Love notes readable offline
  description: >-
    The notes thread renders from the local copy offline and refreshes on
    reconnect and Realtime (CAP-1, CAP-2). Images use the cached copy keyed by
    storage path, not by signed URL.
- id: "9"
  title: Love-note text saved offline and sent later
  description: >-
    Text notes written offline appear as pending and send automatically once
    online, in order and exactly once (CAP-3). A note with a picture still needs
    a connection.
  spec_checkpoint: true
- id: "10"
  title: All photos viewable offline
  description: >-
    The gallery list and every photo's image are kept for offline viewing
    (CAP-5). Only when the browser refuses storage are the oldest images
    dropped, and those show a placeholder.
- id: "11"
  title: Needs-a-connection handling everywhere else
  description: >-
    Offline, every write that is not a queued mood or love-note text is
    refused before any request, shows the needs-a-connection message, and
    leaves the screen's data unchanged (CAP-4). The custom-messages editor, the
    one data screen that lacks it, shows the offline indicator (CAP-8).
- id: "12"
  title: Move custom messages and favorites onto the foundation
  description: >-
    Move custom messages and favorites off their own IndexedDB storage onto the
    shared local-copy mechanism and drop the old storage in dbSchema.ts
    (One-mechanism constraint). Custom-message ids stay stable so daily-message
    rotation history is unchanged. Dropping the stores also removes rows left
    by accounts that signed out before story 2.

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Interaction Realtime harness</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { mountInteractionRealtimeHarness } from './interaction-realtime.tsx';

      const userId = new URLSearchParams(window.location.search).get('userId');

      mountInteractionRealtimeHarness(userId);
    </script>
  </body>

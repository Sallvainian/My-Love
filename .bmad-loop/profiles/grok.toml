# xAI Grok CLI (>= 1.0.30). Grok's hook files use the same JSON `hooks` object
# as Claude Code (verified against ~/.grok/hooks/vibe-island.json), and its hook
# payload carries session_id / transcript_path / hook_event_name — the three
# fields .bmad-loop/bmad_loop_hook.py reads — so the claude-settings-json
# dialect applies unchanged, pointed at Grok's project hook directory.
#
# Skill discovery does NOT include <repo>/.claude/skills — Grok scans
# ./.grok/skills, <repo_root>/.grok/skills, ~/.grok/skills and ~/.claude/skills
# only — hence skill_tree = ".grok/skills". Grok's README says repo-scoped skills
# are filtered out when gitignored; grok 1.0.30 does not do that, so .grok/ is
# gitignored like .claude/ and _bmad/ (see below). The bmad-* skills there are
# COPIES of .claude/skills/* (not symlinks: bmad-loop runs sessions in git
# worktree checkouts where gitignored .claude/ is absent, so links would
# dangle). They therefore go stale on a BMAD upgrade — re-copy after running
# `npx bmad-method install`.
#
# No usage parser exists for Grok's transcript format, so usage_parser = "none":
# token budgeting (limits.max_tokens_per_session) is inert for Grok stages.
name = "grok"
binary = "grok"
prompt_template = "Use the ${skill} skill now, and use subagents as needed: {args}"
bypass_args = ["--always-approve"]
model_flag = "--model"
usage_parser = "none"
skill_tree = ".grok/skills"
first_run_note = "run `grok` once in the project and run /hooks-trust to trust project hooks (untrusted hooks never execute)"

# .grok is untracked (matching this repo's convention of not tracking
# .claude/ , .agents/ and _bmad/), so a `git worktree add` checkout omits it.
# seed_files copies the tree in from the main repo, which is what lets an
# isolated review session still resolve bmad-build-auto. Directories are
# supported (worktree_flow.py walks them recursively).
#
# .grok/hooks is listed for the same reason: `config_path` below points into it,
# and without seeding it a worktree review session starts with no hook config at
# all -- silently, since untrusted or absent hooks simply never fire.
seed_files = [".grok/skills", ".grok/hooks"]

# SessionEnd is deliberately NOT mapped. Grok scopes its hooks per session and a
# SUBAGENT is a session: when one finishes, grok fires SessionEnd carrying the
# subagent's id and its own transcript, not the main session's. bmad-loop's
# generic adapter reads any SessionEnd as proof the CLI died and returns
# "crashed" unconditionally (adapters/generic.py:1067), so every grok session
# that outlived a subagent was killed mid-work. Measured on run
# 20260914-184113-c59d, four times, always the same shape -- e.g. dev-1-g2's
# main session was 01a0a338-033c-7c41-8446-a2ace771401e while the fatal
# SessionEnd carried 01a0a33d-8f9c-7611-b4d3-0b98e4dc077e, which grok's own log
# names 14ms later as `subagent completed {subagent_id: 01a0a33d-8f9c-...}`.
# The adapter has this guard for Copilot but only on Stop, keyed on an EMPTY
# transcript_path (generic.py:1002-1013); grok's subagent SessionEnd carries a
# real one, so that filter cannot catch it.
#
# Unmapped, the relay is never registered for the event and no SessionEnd file
# is ever written, which puts grok on the same footing as Codex: a real death is
# caught by the window-death probe instead (generic.py:915-925, "died without a
# SessionEnd hook"), ~5s later rather than instantly. That is the whole cost.
# Do not re-add SessionEnd without first confirming grok stopped firing it for
# subagents (verified against grok 1.0.30).
[hooks]
dialect = "claude-settings-json"
config_path = ".grok/hooks/bmad-loop.json"
events = { SessionStart = "SessionStart", Stop = "Stop", PreCompact = "PreCompact" }

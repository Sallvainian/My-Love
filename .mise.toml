[tools]
# Track the latest 24.x rather than an exact patch. mise.lock pins the exact
# resolved version so every machine and CI still install the same build;
# run `mise upgrade node` to move the lock to a newer 24.x.
node = "24"
# The version CI pins in .github/actions/setup-supabase/action.yml, deploy.yml
# and supabase-migrations.yml; bump all four together. An exact version, not
# "latest": scripts/sim-driver/sim compares `supabase --version` to this string.
supabase = "3.4.0"

[settings]
# Read and update mise.lock alongside this file.
lockfile = true

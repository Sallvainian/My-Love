[workflow]

activation_steps_prepend = [
  "If the invocation names a ticket from the tree (a ref such as 4.7, a ticket file name, or a ticket title), set the workflow variable ticket_ref to that ticket's ref. Then read `_bmad/_config/custom/bmad-workflow-lang.md` for the workflow language specification, then execute `_bmad/_config/custom/workflows/bmad-build/activation.yaml`. If it switched the session into a worktree (it says \"Switched to\"), render this skill again from there and follow that output from its start instead of this one, so every path the skill uses points into the worktree: `uv run --no-cache \"<worktree>/_bmad/scripts/render_skill.py\" --project-root \"<worktree>\" --skill \"{skill-root}\"`. The re-rendered activation finds the session already there and does not switch again.",
]

on_complete = """
This step pushes the ticket branch and opens its MR/PR, which bmad-build's own rule ("NEVER auto-push") holds for the user: ask once — "Push the ticket branch, open its MR/PR and wait for CI? (yes/no)" — and on yes read `_bmad/_config/custom/bmad-workflow-lang.md` for the workflow language specification, then execute `_bmad/_config/custom/workflows/common/post-build-dispatch-interactive.yaml`, with plan_file set to {plan_file}. On no, skip it: `/bmad-issue-tracking-sync` mirrors the ticket's status later.
"""

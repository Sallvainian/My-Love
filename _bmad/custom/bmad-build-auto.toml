# Overrides for bmad-build-auto on this machine.
#
# Why this exists: workflow.md's "Subagents" section requires blocking subagent
# calls awaited in the same turn, and forbids async/detached ones. Claude Code's
# Agent tool has no blocking form, so that instruction cannot be followed here.
# On 2026-09-13 a story-8 coordinator resolved the conflict by inventing a
# sleep-and-poll wait: 240s, 420s, 480s then 540s of blocking sleep, while the
# implementer it was waiting on had already finished 17 minutes earlier. The
# story-7 coordinator, same run and model, used the mailbox instead and slept
# zero seconds.
#
# Merge rules (from the skill's customize.toml): lists append to the default.

[workflow]

persistent_facts = [
"""
SUBAGENT WAITING ON THIS MACHINE. Where this conflicts with workflow.md's
"Subagents" section, this is correct and workflow.md is describing a different
host.

The Agent tool here is ASYNCHRONOUS and has no blocking form. A spawn returns
immediately with a mailbox address; the subagent's result reaches you later as
a notification delivered between tool rounds. Two consequences:

1. workflow.md's "several blocking calls awaited together in the same turn"
   cannot be satisfied — there is no such call to make. Do NOT HALT with
   `no subagents` on account of this alone; spawning works fine.

2. workflow.md's "there is no event loop to resume a yielded turn" is false
   here. There is one. The completion notification is exactly how your turn
   resumes, and ending your turn to await it is safe and expected.

So: launch the subagents a step calls for in one message, then STOP and wait,
doing nothing. The completion arrives on its own and you continue from there.

NEVER wait by blocking. No `sleep` inside a Bash call, no timed `git status`
poll loop, no "check again in N minutes" cycle. A blocking tool call holds the
tool round open, and notifications and cross-session messages are only
delivered BETWEEN tool rounds — so sleeping blocks the very signal you are
waiting for, and a message sent to you sits queued until the sleep ends. A
PreToolUse hook on this machine denies sleeps of 120 seconds or more for this
reason; treat that denial as correct, not as an obstacle to route around with
several shorter sleeps.

If you genuinely must observe external state (a CI run, a file produced by
another process), poll it in the BACKGROUND — Bash with run_in_background:
true, an until-loop with short sleeps — and let its completion notify you.
Never in the foreground.
"""
]

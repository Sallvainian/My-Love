name: Supabase Migration Validation

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest

      - name: Start Supabase local
        run: |
          supabase init --workdir . || true
          supabase start --ignore-health-check

      - name: Apply migrations
        id: migrate
        run: |
          echo "🔄 Applying migrations..."
          supabase db reset --debug 2>&1 | tee migration-output.txt

          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ Migration failed"
            echo "migration_status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "✅ All migrations applied successfully"
          echo "migration_status=success" >> $GITHUB_OUTPUT

      - name: Type-check plpgsql function bodies
        run: |
          echo "🔎 Running plpgsql_check over public..."
          # `supabase db lint` is plpgsql_check. It type-checks function bodies
          # and nothing else. It is NOT the Supabase advisor linter: it emits no
          # 00xx lint, so it can never report rls_enabled_no_policy,
          # security_definer_view, or the security_definer_function_executable
          # pair -- and no CLI command can. Those exist only in the dashboard and
          # the management API, so CI cannot gate on them.
          #
          # A step here used to grep this command's output for "rls" and print
          # "No RLS policy warnings". plpgsql_check never emits that substring,
          # so the check passed unconditionally and validated nothing; it was
          # removed rather than repaired. RLS and policy shape are asserted for
          # real by the pgTAP suite -- `policies_are` pins the exact policy set
          # per table -- which runs as `supabase test db` in the db-tests job of
          # test.yml, on every PR that changes a non-documentation file.
          #
          # --fail-on is load-bearing: without it db lint exits 0 no matter what
          # it finds (the old `|| true` here doubly guaranteed that, so this step
          # could never fail). --schema public because the pgTAP extension the
          # migrations install lints with 8 false errors in `extensions`, and
          # every app function lives in public.
          supabase db lint --schema public --level error --fail-on error

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

      - name: Migration Summary
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ "${{ steps.migrate.outputs.migration_status }}" = "success" ]; then
            echo "✅ Migration validation passed"
          else
            echo "❌ Migration validation failed"
            echo "Check migration-output.txt for details"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

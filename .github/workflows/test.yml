# Test Pipeline - Lint, Unit, DB, Integration, API, E2E, Burn-In
# Generated by TEA (Test Architect) CI workflow
# Stack: fullstack (React PWA + Supabase backend) | Frameworks: Vitest + Playwright + pgTAP

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 2 * * 0' # Weekly burn-in on Sundays at 2 AM UTC
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================
  # Stage 0: Change detection
  # Documentation-only PRs skip the app test stages. Deliberately keyed on
  # "can this change affect the app", NOT on "did test files change" — tests
  # exist to validate source changes, so gating them on test-file edits would
  # leave every source and dependency PR untested.
  # ============================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect app-affecting changes
        id: filter
        run: |
          set -euo pipefail

          # Only pull_request events have a base to diff against. Pushes to main,
          # the weekly cron and manual dispatches always run the full suite.
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "Event is ${{ github.event_name }} — running full suite"
            exit 0
          fi

          git fetch --no-tags origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "Changed files:"
          echo "$CHANGED"

          # Fail safe: an empty diff runs everything rather than nothing.
          if [[ -z "$CHANGED" ]]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "Empty diff — running full suite"
            exit 0
          fi

          NON_DOCS=$(echo "$CHANGED" | grep -vE '(^docs/|^_bmad-output/|\.md$)' || true)
          if [[ -z "$NON_DOCS" ]]; then
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "Documentation-only change — app test stages will be skipped"
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "App-affecting files changed:"
            echo "$NON_DOCS"
          fi

  # ============================================
  # Stage 1: Lint, Type Check
  # ============================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

  # ============================================
  # Stage 2: Unit Tests (Vitest)
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 7

  # ============================================
  # Stage 3: Database Tests (pgTAP)
  # ============================================
  db-tests:
    name: Database Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Setup Supabase Local
        uses: ./.github/actions/setup-supabase

      - name: Run pgTAP tests
        run: supabase test db

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  # ============================================
  # Stage 4: Backend Tests (Integration + API via matrix)
  # ============================================
  backend-tests:
    name: Backend Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [integration, api]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Playwright E2E
        uses: ./.github/actions/setup-playwright-e2e

      - name: Run ${{ matrix.project }} tests
        run: npx playwright test --project=${{ matrix.project }}

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

      - name: Upload ${{ matrix.project }} test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ${{ matrix.project }}-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # ============================================
  # Stage 6: E2E Full (Sharded, chromium only)
  #
  # There was previously an "E2E P0 Gate" job running `--grep "[P0]"` ahead of
  # this one, with e2e-tests gated on it via `needs`. The shards below run the
  # full chromium suite, which already includes every [P0] test, so the gate
  # added ~6.4 min of serial duplicate work to every green run and only paid
  # off when a P0 test failed. Removed; coverage is unchanged.
  # ============================================
  e2e-tests:
    name: E2E (Shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        # 4 shards, not 2. Playwright splits by test count, but the suite is
        # duration-skewed: at 2 shards both got 55 tests yet ran 5.4 min vs
        # 9.6 min. Per-shard provisioning is a fixed ~2.5 min floor, so 4 is
        # where the split stops paying for itself.
        shard: [1, 2, 3, 4]
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Playwright E2E
        uses: ./.github/actions/setup-playwright-e2e

      - name: Run E2E tests (shard ${{ matrix.shard }}/4)
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/4

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  # ============================================
  # Stage 7: Burn-In (Flaky Detection)
  # Only on PRs to main — runs changed E2E specs 5x
  #
  # Runs alongside e2e-tests rather than after it. Burn-in re-runs the changed
  # specs from scratch 5x, so it never consumed anything the shards produced —
  # waiting on them just added the slowest shard to the critical path.
  #
  # Sharded 3 ways because this job, not e2e-tests, is what the pipeline waits
  # on whenever a PR touches E2E specs. On run 32213236507 (8 changed specs, 36
  # tests) the loop ran 5 x 88s = 443s against 6m54s for the slowest E2E shard.
  # That job read 13m31s, but 163s of it was the install-deps step since removed
  # (see setup-playwright-e2e/action.yml); the comparable job today is 10m34s,
  # measured on run 32218238012 — still ~4 minutes past the E2E shards.
  #
  # Sharding rather than raising `workers` is deliberate. The loop below pins
  # --retries=0, so a test that times out under CPU contention goes straight to
  # a red required check with no retry to absorb it; the e2e-tests shards get
  # `retries: 2` from playwright.config.ts and can.
  #
  # What this does NOT give up: per-spec repetition. Every changed spec still
  # runs 5 times, cold, with retries off. What it DOES give up: cross-spec
  # interference. `fullyParallel` is on, so today tests from different spec
  # files co-execute against one Supabase — after sharding, specs in different
  # slices never do, and a slice holding a single one-test file (there are two:
  # scripture-reflection-2.2-errors and scripture-stats) runs at 1 worker rather
  # than 2. playwright.config.ts:107-110 names contention-starved realtime
  # timeouts as this suite's flake class, so that is a real, if partial, loss.
  #
  # The split is round-robin by FILE count, which is not test count: spec files
  # here hold 1 to 12 tests. Applied to the run cited above the slices come out
  # 17/14/5 tests, so the largest shard carries ~47% and the win is nearer 2x
  # than 3x. Shards whose slice comes out empty skip provisioning via the same
  # `specs != ''` guard the whole job already used, so a single-spec PR still
  # burns exactly one runner.
  # ============================================
  burn-in:
    name: Burn-In (Shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    needs: [changes]
    if: >-
      needs.changes.outputs.app == 'true' &&
      github.event_name == 'pull_request' &&
      github.base_ref == 'main'
    strategy:
      # One shard finding a flake must not cancel the others: the point of this
      # job is the report, and a second shard's result is evidence too.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Detect BEFORE provisioning. Setup Playwright E2E costs ~2.5 minutes
      # (deps + browsers + local Supabase) and used to run ahead of this check,
      # so every PR that touched no E2E spec paid for a job that then skipped.
      #
      # `specs` is this shard's slice, not the whole list, so every guard below
      # keys on it and an empty slice costs a checkout rather than a provision.
      - name: Detect changed E2E test files
        id: changed-tests
        run: |
          # set -e, not the bare shell the single-job version used: a transient
          # `git fetch` failure leaves CHANGED empty, which the `|| true` below
          # masks, and the shard then reports success having burned in nothing.
          # One job silently skipping was already wrong; three of them are also
          # indistinguishable from legitimately-empty slices.
          set -euo pipefail
          git fetch origin ${{ github.base_ref }}

          # --diff-filter=d excludes DELETED paths. Without it, a shard whose
          # whole slice is a deleted spec runs `playwright test <gone>` on its
          # own, and Playwright exits 1 with "No tests found" — a red required
          # check for a PR that merely removed a spec. The single-invocation
          # version tolerated this because the surviving filters still matched
          # something; three narrow invocations do not. Commit 401fd769 is
          # exactly this shape: 4 changed specs, one of them a deletion.
          CHANGED=$(git diff --name-only --diff-filter=d origin/${{ github.base_ref }}...HEAD | grep -E '^tests/e2e/.*\.(spec|test)\.(ts|tsx|js|jsx)$' || true)

          # NF drops the blank line `echo` emits for an empty CHANGED, which
          # would otherwise hand shard 1 a one-element list of "".
          MINE=$(echo "$CHANGED" | awk -v s="${{ matrix.shard }}" -v t=3 'NF && (NR % t) == (s % t)')

          echo "All changed E2E specs:"
          echo "${CHANGED:-  (none)}"
          echo "This shard (${{ matrix.shard }}/3) will burn in:"
          echo "${MINE:-  (none)}"

          echo "specs<<EOF" >> "$GITHUB_OUTPUT"
          echo "$MINE" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Skip burn-in (no E2E specs for this shard)
        if: steps.changed-tests.outputs.specs == ''
        run: echo "Nothing for shard ${{ matrix.shard }}/3 — skipped"

      - uses: actions/setup-node@v7
        if: steps.changed-tests.outputs.specs != ''
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Playwright E2E
        if: steps.changed-tests.outputs.specs != ''
        uses: ./.github/actions/setup-playwright-e2e

      - name: Run burn-in (5 iterations)
        if: steps.changed-tests.outputs.specs != ''
        env:
          SPECS: ${{ steps.changed-tests.outputs.specs }}
        run: |
          echo "Running 5 iterations on shard ${{ matrix.shard }}/3's changed E2E test files"
          # --retries=0 is load-bearing. The job sets CI=true, and
          # playwright.config.ts reads `retries: process.env.CI ? 2 : 0`, so
          # without this flag each iteration retries a failure twice and burn-in
          # reports "5/5 stable" for a spec that flaked up to 10 times. A flake
          # detector that retries flakes away detects nothing.
          #
          # Five SEPARATE invocations, not one --repeat-each=5. Each iteration
          # is a cold start — fresh worker processes, fresh browser, fresh
          # login — which is the state most flakes surface in. --repeat-each
          # would interleave all 25 executions into one warm scheduler pool and
          # lose both that and the `|| exit 1` fail-fast below.
          for i in {1..5}; do
            echo "--- Burn-in iteration $i/5 (shard ${{ matrix.shard }}/3) ---"
            npx playwright test --project=chromium --retries=0 $SPECS || exit 1
          done
          echo "Burn-in passed: 5/5 stable on shard ${{ matrix.shard }}/3"

      - name: Stop Supabase
        if: always() && steps.changed-tests.outputs.specs != ''
        run: supabase stop --no-backup

      - name: Upload burn-in failures
        if: failure() && steps.changed-tests.outputs.specs != ''
        uses: actions/upload-artifact@v7
        with:
          # Must carry the shard: upload-artifact@v4+ rejects a second upload
          # to a name that already exists, so three shards sharing one name
          # would fail every shard that lost the race — masking the real
          # failure this step exists to preserve.
          name: burn-in-failures-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # ============================================
  # Stage 8: Merge Reports
  # ============================================
  merge-reports:
    name: Merge Reports
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [e2e-tests]
    if: always() && needs.e2e-tests.result != 'cancelled' && needs.e2e-tests.result != 'skipped'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Playwright for report merge
        run: npm install --no-save @playwright/test

      - name: Download shard results
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-results-shard-*
          path: all-results/
          merge-multiple: true

      - name: Merge Playwright reports
        run: |
          if [ -d "all-results" ] && [ "$(ls -A all-results 2>/dev/null)" ]; then
            npx playwright merge-reports --reporter=html all-results/ || echo "Merge skipped"
          else
            echo "No results to merge"
          fi

      - name: Upload merged report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: merged-playwright-report
          path: playwright-report/
          retention-days: 30

  # ============================================
  # Summary (branch protection target)
  # ============================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes, lint, unit-tests, db-tests, backend-tests, e2e-tests, burn-in]
    if: always()
    steps:
      - name: Evaluate results
        run: |
          # This job is the sole required status check, so it must always report.
          # Never skip it via paths-ignore: a required check that never runs is
          # treated as pending, and the PR stays blocked forever.
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Change detection did not succeed — cannot verify what to run"
            exit 1
          fi

          if [[ "${{ needs.changes.outputs.app }}" != "true" ]]; then
            echo "Documentation-only change — app test stages skipped"
            exit 0
          fi

          echo "Lint:              ${{ needs.lint.result }}"
          echo "Unit Tests:        ${{ needs.unit-tests.result }}"
          echo "DB Tests:          ${{ needs.db-tests.result }}"
          echo "Backend Tests:     ${{ needs.backend-tests.result }}"
          echo "E2E Tests:         ${{ needs.e2e-tests.result }}"
          echo "Burn-In:           ${{ needs.burn-in.result }}"

          # Check standard jobs
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
             [[ "${{ needs.db-tests.result }}" != "success" ]] || \
             [[ "${{ needs.backend-tests.result }}" != "success" ]] || \
             [[ "${{ needs.e2e-tests.result }}" != "success" ]]; then
            echo "One or more standard stages failed"
            exit 1
          fi

          # Check burn-in (allow skipped on non-PR events)
          if [[ "${{ needs.burn-in.result }}" == "failure" ]] || \
             [[ "${{ needs.burn-in.result }}" == "cancelled" ]]; then
            echo "Burn-in flakiness detection failed"
            exit 1
          fi

          echo "All stages passed"

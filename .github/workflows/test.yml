# Test Pipeline - Lint, Unit, DB, Integration, API, E2E, Burn-In
# Generated by TEA (Test Architect) CI workflow
# Stack: fullstack (React PWA + Supabase backend) | Frameworks: Vitest + Playwright + pgTAP

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 2 * * 0' # Weekly full suite on Sundays at 2 AM UTC; burn-in runs only on PRs
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================
  # Stage 0: Change detection
  # Documentation-only PRs skip the app test stages. Deliberately keyed on
  # "can this change affect the app", NOT on "did test files change" — tests
  # exist to validate source changes, so gating them on test-file edits would
  # leave every source and dependency PR untested.
  # ============================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      # Per-stage gates. Each answers "could this change break THIS stage?", and
      # each is a superset of what the stage actually reads — a gate that is
      # wrong in the `false` direction skips a stage silently and ships the bug
      # it would have caught, so every one of these errs toward `true`.
      db: ${{ steps.filter.outputs.db }}
      backend: ${{ steps.filter.outputs.backend }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect app-affecting changes
        id: filter
        run: |
          set -euo pipefail

          # Only pull_request events have a base to diff against. Pushes to main,
          # the weekly cron and manual dispatches always run the full suite.
          # `all` is the fail-safe writer: every gate true. Used for pushes to
          # main, the weekly cron, manual dispatch and an unreadable diff, so a
          # stage is never skipped on any path that lacks a base to reason from.
          all() {
            { echo "app=true"; echo "db=true"; echo "backend=true"; echo "e2e=true"; } >> "$GITHUB_OUTPUT"
          }

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            all
            echo "Event is ${{ github.event_name }} — running full suite"
            exit 0
          fi

          # Both guarded: without `|| { all; exit 0; }` a transient fetch failure
          # aborts under `set -e`, which reds the sole required check for a
          # network blip. Falling back to the full suite is never wrong — it only
          # costs time — whereas failing the check costs a re-run and a merge.
          git fetch --no-tags origin "${{ github.base_ref }}" || {
            echo "Base fetch failed — running full suite"; all; exit 0
          }
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD") || {
            echo "Diff against base failed — running full suite"; all; exit 0
          }
          echo "Changed files:"
          echo "$CHANGED"

          # Fail safe: an empty diff runs everything rather than nothing.
          if [[ -z "$CHANGED" ]]; then
            all
            echo "Empty diff — running full suite"
            exit 0
          fi

          NON_DOCS=$(echo "$CHANGED" | grep -vE '(^docs/|^_bmad-output/|\.md$)' || true)
          if [[ -z "$NON_DOCS" ]]; then
            { echo "app=false"; echo "db=false"; echo "backend=false"; echo "e2e=false"; } >> "$GITHUB_OUTPUT"
            echo "Documentation-only change — app test stages will be skipped"
            exit 0
          fi

          echo "app=true" >> "$GITHUB_OUTPUT"
          echo "App-affecting files changed:"
          echo "$NON_DOCS"

          # A herestring, NOT `echo "$NON_DOCS" | grep -qE`. Under `set -o
          # pipefail` the pipe form is wrong in the dangerous direction: once the
          # list exceeds the 64 KiB pipe buffer, `grep -q` exits at the first
          # match and closes the pipe, the forked `echo` dies of SIGPIPE (141),
          # pipefail propagates it, and `has` reports NO MATCH on a list that
          # matched. Reproduced at 3,300 paths / 66 KB; every stage would then
          # skip on a mass rename or formatting sweep. A herestring has no pipe
          # and no second process, so the exit status is grep's alone.
          has() { grep -qE "$1" <<<"$NON_DOCS"; }

          # Anything touching the harness itself, dependencies or tooling config
          # re-enables every stage: those change how the suites run, not just
          # what they assert, so no per-stage reasoning about them is sound.
          # `^\.?mise\.` matches both tracked pin files — `mise.lock` and
          # `.mise.toml`; the leading dot on the latter is easy to miss.
          # `^\.env` covers .env.test, which playwright.config.ts:174 documents
          # as the environment the E2E dev server loads via `vite --mode test`.
          INFRA='^\.github/|^package(-lock)?\.json$|^tsconfig|^vitest\.config|^playwright\.config|^tests/support/|^scripts/|^\.?mise\.|^\.nvmrc$|^\.env'
          if has "$INFRA"; then
            { echo "db=true"; echo "backend=true"; echo "e2e=true"; } >> "$GITHUB_OUTPUT"
            echo "Harness/dependency/tooling change — all stages enabled"
            exit 0
          fi

          # db-tests is pgTAP against the schema: only SQL, the Supabase config
          # and the pgTAP files themselves can move it. Edge Function source
          # cannot — pgTAP never invokes one.
          DB='^supabase/(migrations|tests)/|^supabase/config\.toml$|^supabase/seed'
          # backend-tests drives RPCs, Storage and the Edge Function over the
          # wire, so it takes the DB set plus function source plus its own specs
          # — plus `^src/`, which is not optional: six tests/api specs import
          # runtime code from src/, three of them as values rather than types
          # (`handleSupabaseError`/`isPostgrestError` from src/api/errorHandlers
          # at empty-database-error-fallback.spec.ts:17 and
          # check-constraint-error-mapping.spec.ts:52, `formatDateISO` from
          # src/utils/dateUtils at events-read-window.spec.ts:46). Without it a
          # src-only change skips the very specs that pin its behaviour, and
          # lint/typecheck catch a signature break but never a behavioural one.
          BACKEND="$DB|^supabase/functions/|^tests/(api|integration)/|^src/"
          # e2e-tests drives the browser against the app and its database.
          # supabase/functions/ is included deliberately even though no current
          # tests/e2e spec exercises the upload path: the app does call it, the
          # comment that asserted otherwise went stale once already, and a wrong
          # `false` here is silent.
          # `supabase/tests/` is excluded on purpose: pgTAP files are fixtures the
          # browser app never loads, so they cannot move an E2E result. Every
          # other supabase/ path can — migrations change the schema the app
          # reads, config.toml changes the stack it talks to, and functions/ is
          # reachable from the app even though no tests/e2e spec walks that path
          # today.
          E2E='^src/|^index\.html$|^public/|^vite\.config|^tailwind\.config|^postcss\.config|^tests/e2e/|^supabase/(migrations|functions)/|^supabase/config\.toml$|^supabase/seed'

          for pair in "db:$DB" "backend:$BACKEND" "e2e:$E2E"; do
            name=${pair%%:*}; pat=${pair#*:}
            if has "$pat"; then echo "$name=true" >> "$GITHUB_OUTPUT"; else echo "$name=false" >> "$GITHUB_OUTPUT"; fi
          done
          echo "Gates: db=$(has "$DB" && echo true || echo false) backend=$(has "$BACKEND" && echo true || echo false) e2e=$(has "$E2E" && echo true || echo false)"

  # ============================================
  # Stage 1: Lint, Type Check
  # ============================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      # `npm run lint` is passed `src tests scripts` and every tsconfig includes
      # only `src`/`tests`, so nothing above ever parses supabase/functions/**.
      # Without this step the bounded-body handler could be reverted to
      # `await req.arrayBuffer()` with the pipeline green: the api Playwright
      # spec answers cap+1 from the Content-Length precheck before the streaming
      # read is even reached, so it would not notice.
      # `deno test` type-checks the modules it imports, which is what covers
      # handler.ts. `index.ts` is deliberately left out: checking it would pull
      # @supabase/supabase-js from esm.sh and put this job at the mercy of a
      # third-party CDN.
      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      # --no-lock deliberately: a bare run writes a deno.lock at the repo root,
      # and an untested lockfile could change what `supabase functions deploy`
      # resolves.
      - name: Edge Function tests
        run: deno test --no-lock supabase/functions/upload-love-note-image/

  # ============================================
  # Stage 2: Unit Tests (Vitest)
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage
        env:
          # Shuffle seed: a new order each run, replayable with SEED=<run number>.
          SEED: ${{ github.run_number }}

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 7

  # ============================================
  # Stage 3: Database Tests (pgTAP)
  # ============================================
  db-tests:
    name: Database Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.db == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Setup Supabase Local
        uses: ./.github/actions/setup-supabase

      - name: Run pgTAP tests
        run: supabase test db

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  # ============================================
  # Stage 4: Backend Tests (Integration + API via matrix)
  # ============================================
  backend-tests:
    name: Backend Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [integration, api]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Playwright E2E
        uses: ./.github/actions/setup-playwright-e2e
        with:
          # Only this leg reads a real auth email
          # (tests/api/pkce-code-exchange.spec.ts). Every other Supabase job
          # keeps Mailpit excluded, so the pull saving the exclusion list
          # documents is not re-spent nine times over.
          needs-mail: ${{ matrix.project == 'api' }}
          # Same leg, different container: tests/api/upload-love-note-image-limits.spec.ts
          # calls /functions/v1/upload-love-note-image, which Kong answers 503
          # for unless the edge runtime is up.
          needs-edge-functions: ${{ matrix.project == 'api' }}

      - name: Run ${{ matrix.project }} tests
        run: npx playwright test --project=${{ matrix.project }}

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

      - name: Upload ${{ matrix.project }} test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ${{ matrix.project }}-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # ============================================
  # Stage 6: E2E Full (Sharded, chromium only)
  #
  # There was previously an "E2E P0 Gate" job running `--grep "[P0]"` ahead of
  # this one, with e2e-tests gated on it via `needs`. The shards below run the
  # full chromium suite, which already includes every [P0] test, so the gate
  # added ~6.4 min of serial duplicate work to every green run and only paid
  # off when a P0 test failed. Removed; coverage is unchanged.
  # ============================================
  e2e-tests:
    name: E2E (Shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        # 2 shards, not 4. Measured on run 35056348791 (head 0a83dec8): E2E
        # jobs 197/224/251/259s total, setup 129/129/138/129s, test-step
        # 49/70/86/101s (306s combined). Historical 381s is run 32279178457,
        # not this run. The setup floor (129-138s) is paid per shard and this
        # work cannot move it. Two jobs share those 306s of tests plus one
        # setup floor each. Residual job time besides setup and tests
        # (checkout, node, stop, upload) measured 19/25/27/29s. Conservative
        # worst wall from max setup, 86+101 test-step, and max residual:
        # 138+187+29 = 354s versus 259s at 4. Runner time 931s at 4 versus
        # 2×(setup+residual)+306; typical 129+25 gives 614s. N=1 serialises
        # all 306s of tests (138+306+29 = 473s wall) and is the first N that
        # stops making sense against wall-clock.
        shard: [1, 2]
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Playwright E2E
        uses: ./.github/actions/setup-playwright-e2e

      - name: Run E2E tests (shard ${{ matrix.shard }}/2)
        env:
          E2E_BLOB_REPORT: '1'
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/2

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30

      - name: Upload shard blob report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-blob-report-shard-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: error
          retention-days: 30

  # ============================================
  # Stage 7: Burn-In (Flaky Detection)
  # Only on PRs to main — runs changed E2E specs 5x
  #
  # Runs alongside e2e-tests rather than after it. Burn-in re-runs the changed
  # specs from scratch 5x, so it never consumed anything the shards produced —
  # waiting on them just added the slowest shard to the critical path.
  #
  # Sharded 3 ways because this job, not e2e-tests, is what the pipeline waits
  # on whenever a PR touches E2E specs. On run 32213236507 (8 changed specs, 36
  # tests) the loop ran 5 x 88s = 443s against 6m54s for the slowest E2E shard.
  # That job read 13m31s, but 163s of it was the install-deps step since removed
  # (see setup-playwright-e2e/action.yml); the comparable job today is 10m34s,
  # measured on run 32218238012 — still ~4 minutes past the E2E shards.
  #
  # Sharding rather than raising `workers` is deliberate. The loop below pins
  # --retries=0, so a test that times out under CPU contention goes straight to
  # a red required check with no retry to absorb it; the e2e-tests shards get
  # `retries: 2` from playwright.config.ts and can.
  #
  # What this does NOT give up: per-spec repetition. Every changed spec still
  # runs 5 times, cold, with retries off. What it DOES give up: cross-spec
  # interference. `fullyParallel` is on, so today tests from different spec
  # files co-execute against one Supabase — after sharding, specs in different
  # slices never do, and a slice holding a single one-test file runs at 1
  # worker rather than 2. playwright.config.ts:107-110 names contention-starved
  # realtime timeouts as this suite's flake class, so that is a real, if
  # partial, loss.
  #
  # The split is round-robin by FILE count, which is not test count: spec files
  # here hold 1 to 12 tests. Applied to the run cited above the slices come out
  # 17/14/5 tests, so the largest shard carries ~47% and the win is nearer 2x
  # than 3x. Shards whose slice comes out empty skip provisioning via the same
  # `specs != ''` guard the whole job already used, so a single-spec PR still
  # burns exactly one runner.
  # ============================================
  burn-in:
    name: Burn-In (Shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    needs: [changes]
    # Gated on `e2e`, not `app`: this job burns in changed tests/e2e specs, and
    # its own detection pattern (^tests/e2e/...\.(spec|test)\.) is a strict
    # subset of the e2e gate's ^tests/e2e/, so a change that leaves `e2e` false
    # cannot contain a spec for it to run. Without this, a tests/unit-only PR
    # spins three runners through a fetch-depth:0 checkout just to skip.
    if: >-
      needs.changes.outputs.e2e == 'true' &&
      github.event_name == 'pull_request' &&
      github.base_ref == 'main'
    strategy:
      # One shard finding a flake must not cancel the others: the point of this
      # job is the report, and a second shard's result is evidence too.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Detect BEFORE provisioning. Setup Playwright E2E costs ~2.5 minutes
      # (deps + browsers + local Supabase) and used to run ahead of this check,
      # so every PR that touched no E2E spec paid for a job that then skipped.
      #
      # `specs` is this shard's slice, not the whole list, so every guard below
      # keys on it and an empty slice costs a checkout rather than a provision.
      - name: Detect changed E2E test files
        id: changed-tests
        run: |
          # set -e, not the bare shell the single-job version used: a transient
          # `git fetch` failure leaves CHANGED empty, which the `|| true` below
          # masks, and the shard then reports success having burned in nothing.
          # One job silently skipping was already wrong; three of them are also
          # indistinguishable from legitimately-empty slices.
          set -euo pipefail
          git fetch origin ${{ github.base_ref }}

          # --diff-filter=d excludes DELETED paths. Without it, a shard whose
          # whole slice is a deleted spec runs `playwright test <gone>` on its
          # own, and Playwright exits 1 with "No tests found" — a red required
          # check for a PR that merely removed a spec. The single-invocation
          # version tolerated this because the surviving filters still matched
          # something; three narrow invocations do not. PR #125 is
          # exactly this shape: 4 changed specs, one of them a deletion.
          CHANGED=$(git diff --name-only --diff-filter=d origin/${{ github.base_ref }}...HEAD | grep -E '^tests/e2e/.*\.(spec|test)\.(ts|tsx|js|jsx)$' || true)

          # NF drops the blank line `echo` emits for an empty CHANGED, which
          # would otherwise hand shard 1 a one-element list of "".
          MINE=$(echo "$CHANGED" | awk -v s="${{ matrix.shard }}" -v t=3 'NF && (NR % t) == (s % t)')

          echo "All changed E2E specs:"
          echo "${CHANGED:-  (none)}"
          echo "This shard (${{ matrix.shard }}/3) will burn in:"
          echo "${MINE:-  (none)}"

          echo "specs<<EOF" >> "$GITHUB_OUTPUT"
          echo "$MINE" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Skip burn-in (no E2E specs for this shard)
        if: steps.changed-tests.outputs.specs == ''
        run: echo "Nothing for shard ${{ matrix.shard }}/3 — skipped"

      - uses: actions/setup-node@v7
        if: steps.changed-tests.outputs.specs != ''
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Playwright E2E
        if: steps.changed-tests.outputs.specs != ''
        uses: ./.github/actions/setup-playwright-e2e

      - name: Run burn-in (5 iterations)
        if: steps.changed-tests.outputs.specs != ''
        env:
          SPECS: ${{ steps.changed-tests.outputs.specs }}
        run: |
          echo "Running 5 iterations on shard ${{ matrix.shard }}/3's changed E2E test files"
          # --retries=0 is load-bearing. The job sets CI=true, and
          # playwright.config.ts reads `retries: process.env.CI ? 2 : 0`, so
          # without this flag each iteration retries a failure twice and burn-in
          # reports "5/5 stable" for a spec that flaked up to 10 times. A flake
          # detector that retries flakes away detects nothing.
          #
          # Five SEPARATE invocations, not one --repeat-each=5. Each iteration
          # is a cold start — fresh worker processes, fresh browser, fresh
          # login — which is the state most flakes surface in. --repeat-each
          # would interleave all 25 executions into one warm scheduler pool and
          # lose both that and the `|| exit 1` fail-fast below.
          for i in {1..5}; do
            echo "--- Burn-in iteration $i/5 (shard ${{ matrix.shard }}/3) ---"
            npx playwright test --project=chromium --retries=0 $SPECS || exit 1
          done
          echo "Burn-in passed: 5/5 stable on shard ${{ matrix.shard }}/3"

      - name: Stop Supabase
        if: always() && steps.changed-tests.outputs.specs != ''
        run: supabase stop --no-backup

      - name: Upload burn-in failures
        if: failure() && steps.changed-tests.outputs.specs != ''
        uses: actions/upload-artifact@v7
        with:
          # Must carry the shard: upload-artifact@v4+ rejects a second upload
          # to a name that already exists, so three shards sharing one name
          # would fail every shard that lost the race — masking the real
          # failure this step exists to preserve.
          name: burn-in-failures-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # ============================================
  # Stage 8: Merge Reports
  # ============================================
  merge-reports:
    name: Merge Reports
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [e2e-tests]
    if: always() && needs.e2e-tests.result != 'cancelled' && needs.e2e-tests.result != 'skipped'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Playwright for report merge
        run: npm ci

      - name: Download shard blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-blob-report-shard-*
          path: all-blob-reports/
          merge-multiple: true

      - name: Merge Playwright reports
        run: |
          # Every shard must contribute; never publish a silently partial report.
          shopt -s nullglob
          reports=(all-blob-reports/*.zip)
          if (( ${#reports[@]} != 2 )); then
            echo "::error::Expected 2 shard blob reports, found ${#reports[@]}."
            printf 'Available blob reports: %s\n' "${reports[@]}"
            exit 1
          fi
          npx playwright merge-reports --reporter=html all-blob-reports/

      - name: Upload merged report
        uses: actions/upload-artifact@v7
        with:
          name: merged-playwright-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 30

  # ============================================
  # Summary (branch protection target)
  # ============================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes, lint, unit-tests, db-tests, backend-tests, e2e-tests, burn-in]
    if: always()
    steps:
      - name: Evaluate results
        run: |
          # This job is the sole required status check, so it must always report.
          # Never skip it via paths-ignore: a required check that never runs is
          # treated as pending, and the PR stays blocked forever.
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Change detection did not succeed — cannot verify what to run"
            exit 1
          fi

          if [[ "${{ needs.changes.outputs.app }}" != "true" ]]; then
            echo "Documentation-only change — app test stages skipped"
            exit 0
          fi

          # A stage that was gated off reports `skipped` — and so does a stage
          # that never ran because something upstream broke. Those must not be
          # conflated: `check` accepts `skipped` ONLY when this change's gate for
          # that stage was false. A stage whose gate was true and which did not
          # succeed fails the build, whatever the reason.
          rc=0
          check() {   # <label> <result> <gate>
            local label="$1" result="$2" gate="$3"
            if [[ "$gate" != "true" ]]; then
              if [[ "$result" == "skipped" || "$result" == "success" ]]; then
                echo "$label: $result (not affected by this change)"
                return
              fi
              echo "$label: FAILED — gate was '$gate' but result is '$result'"
              rc=1
              return
            fi
            if [[ "$result" != "success" ]]; then
              echo "$label: FAILED — required for this change, result is '$result'"
              rc=1
              return
            fi
            echo "$label: success"
          }

          check "Lint"          "${{ needs.lint.result }}"          "${{ needs.changes.outputs.app }}"
          check "Unit Tests"    "${{ needs.unit-tests.result }}"    "${{ needs.changes.outputs.app }}"
          check "DB Tests"      "${{ needs.db-tests.result }}"      "${{ needs.changes.outputs.db }}"
          check "Backend Tests" "${{ needs.backend-tests.result }}" "${{ needs.changes.outputs.backend }}"
          check "E2E Tests"     "${{ needs.e2e-tests.result }}"     "${{ needs.changes.outputs.e2e }}"
          echo "Burn-In:           ${{ needs.burn-in.result }}"

          if [[ "$rc" -ne 0 ]]; then
            echo "One or more standard stages failed"
            exit 1
          fi

          # Check burn-in (allow skipped on non-PR events)
          if [[ "${{ needs.burn-in.result }}" == "failure" ]] || \
             [[ "${{ needs.burn-in.result }}" == "cancelled" ]]; then
            echo "Burn-in flakiness detection failed"
            exit 1
          fi

          echo "All stages passed"

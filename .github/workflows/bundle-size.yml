name: Bundle Size

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bundle-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-size:
    name: Check Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Check compressed bundle size
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        # Pinned to v2 deliberately. `v3` is an unreleased development BRANCH, not a
        # release tag — the newest actual release is 2.10.0 and there is no v3 tag.
        # Dependabot mistook the branch for a version in dee216f, and the v3 code
        # invokes the build script as a bare executable, so every run since has died
        # with "Unable to locate executable file: build". Do not let this be bumped to
        # v3 again until an actual v3 release exists.
        uses: preactjs/compressed-size-action@v2
        with:
          build-script: build
          pattern: './dist/**/*.{js,mjs,cjs,css}'
          strip-hash: '\-[A-Za-z0-9_-]{8}\.'
          compression: brotli
          minimum-change-threshold: 100

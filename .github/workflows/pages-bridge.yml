name: GitHub Pages data bridge

# Temporary, run by hand (spec-move-local-data-to-supabase). Serves this
# build at https://sallvainian.github.io/My-Love/, where the home-screen icons
# installed before the move to Cloudflare still open. The old origin's
# localStorage still holds the Supabase session and the anniversaries, and its
# IndexedDB the custom messages and favorites; this build uploads them once
# (src/services/localDataUpload.ts), writes a receipt row to
# public.local_data_uploads, and only then forwards to the same path on
# Cloudflare.
#
# Order of operations -- each step needs the human's go-ahead:
#   1. deploy.yml has applied 20260922000000_local_data_tables.sql and deployed.
#   2. Dispatch this workflow.
#   3. Open the old icon on each phone.
#   4. Evidence: a local_data_uploads row from origin
#      https://sallvainian.github.io for each account.
#   5. Only then run pages-redirect.yml, disable Pages, and remove the
#      github.io entry from the hosted auth redirect allow-list.
#
# No migrations here: the schema ships through deploy.yml alone.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Same Supabase URL as production, so the SDK's default storage key --
      # derived from the URL (src/api/supabaseClient.ts) -- finds the session
      # the old build stored on this origin.
      - name: Build application under /My-Love/
        run: npm run build -- --base=/My-Love/
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_LEGACY_BRIDGE_TARGET: https://my-love.sallvain.workers.dev

      # GitHub Pages serves 404.html for every path that is not a file, which
      # is how a deep link like /My-Love/photos reaches the app.
      - name: Serve the app for deep links
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

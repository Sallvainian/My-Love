name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # write (not read) on both: this workflow answers by posting a comment, on
      # issues as well as PRs, which the read-only defaults silently forbid. The
      # action's own docs/setup.md shows write for each. Left at `contents: read`
      # deliberately — that is the grant Claude would need to push a branch.
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Without these the prompt's verify commands below cannot run — this job
      # otherwise checks out the repo and nothing else.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@86180fa9e4d311eed10c9cc49854c53dab5d517a # v1.0.184
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-opus-5'

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Project rules are NOT duplicated here. The action's injected system
          # prompt already says "Always check for and follow the repository's
          # CLAUDE.md file(s)", and CLAUDE.md imports AGENTS.md, so this prompt
          # points at them instead. Inlining a copy means two places to keep in
          # sync and one of them silently going stale.
          prompt: |
            ## My Love

            Read `AGENTS.md` before changing behavior it covers. It is the single
            source for this repo's policy, layout, conventions and known pitfalls,
            and `CLAUDE.md` imports it.

            ### Before you claim it works

            Dependencies are installed already. Run what your change touches:

            - `npm run typecheck` — `tsc -b --force`
            - `npm run lint` — note AGENTS.md: `scripts/**` is in the eslint
              `ignores`, so a green lint says nothing about `scripts/`
            - `npm run test:unit` — `vitest run`

            Do NOT run `npm run build` in this job and do not treat it as passing.
            This workflow sets no Supabase env vars, and per AGENTS.md a bare
            build still exits 0 and writes `dist/` while producing an artifact
            that throws "Supabase configuration missing" in the browser.

            Do NOT claim E2E coverage. `npm run test:e2e` needs `supabase start`,
            which this job does not run.

            If you could not verify something, say so plainly rather than
            implying it passed.

            ---

            Now execute the task from the comment that tagged you.

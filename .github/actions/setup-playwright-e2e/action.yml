name: 'Setup Playwright E2E'
description: 'Cache browsers, install deps, start Supabase, and install Playwright for E2E tests'

inputs:
  needs-mail:
    description: 'Forwarded to setup-supabase: start the Mailpit catcher for specs that read a real auth email.'
    required: false
    default: 'false'
  needs-edge-functions:
    description: 'Forwarded to setup-supabase: start the edge runtime for specs that call a Supabase Edge Function.'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Cache Playwright browsers
      uses: actions/cache@v6
      id: pw-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
        restore-keys: ${{ runner.os }}-playwright-

    # `npm ci` and `supabase start` share nothing: the Supabase steps use the
    # CLI binary, docker, curl and jq, never node_modules. Run in sequence they
    # cost npm ci's time on every E2E, burn-in and backend job (median 33s,
    # 8-56s over 50 jobs of 2026-11-01/02), so npm ci runs in the background
    # while Supabase starts, and the step after it waits for it and fails the
    # job with npm's own log if it failed. The exit code goes to a file because
    # a background process's status cannot be read from a later step; the PID
    # check stops a killed install from leaving the wait loop spinning until
    # the job timeout.
    - name: Start npm dependencies install (background)
      shell: bash
      run: |
        ( npm ci > "$RUNNER_TEMP/npm-ci.log" 2>&1; echo $? > "$RUNNER_TEMP/npm-ci.exit" ) &
        echo $! > "$RUNNER_TEMP/npm-ci.pid"
        echo "npm ci started in the background (pid $(cat "$RUNNER_TEMP/npm-ci.pid"))"

    - name: Setup Supabase Local
      uses: ./.github/actions/setup-supabase
      with:
        needs-mail: ${{ inputs.needs-mail }}
        needs-edge-functions: ${{ inputs.needs-edge-functions }}

    - name: Wait for npm dependencies install
      shell: bash
      run: |
        pid=$(cat "$RUNNER_TEMP/npm-ci.pid")
        while [ ! -f "$RUNNER_TEMP/npm-ci.exit" ]; do
          if ! kill -0 "$pid" 2>/dev/null && [ ! -f "$RUNNER_TEMP/npm-ci.exit" ]; then
            cat "$RUNNER_TEMP/npm-ci.log"
            echo "::error::npm ci (pid $pid) ended without recording an exit code."
            exit 1
          fi
          sleep 1
        done
        cat "$RUNNER_TEMP/npm-ci.log"
        code=$(cat "$RUNNER_TEMP/npm-ci.exit")
        if [ "$code" != "0" ]; then
          echo "::error::npm ci failed with exit code $code; its log is above."
          exit "$code"
        fi

    - name: Install Playwright browsers
      if: steps.pw-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps chromium

    # There was previously an `npx playwright install-deps chromium` step here,
    # gated on `steps.pw-cache.outputs.cache-hit == 'true'` — the branch this
    # one does not cover. It bought nothing and cost up to 3.5 minutes.
    #
    # Every Chromium runtime library Playwright asks for on ubuntu-24.04
    # (the 21 entries under `chromium:` in playwright-core's nativeDeps table)
    # is already present on the runner image and logs as "already the newest
    # version". The only packages apt actually installed were nine fonts:
    # fonts-wqy-zenhei, fonts-freefont-ttf, fonts-tlwg-loma-otf,
    # fonts-ipafont-gothic, fonts-unifont, xfonts-cyrillic, xfonts-scalable
    # (plus xfonts-encodings and xfonts-utils transitively). Those cover CJK,
    # Thai and Cyrillic glyphs, which nothing here renders: the suite has no
    # toHaveScreenshot/toMatchSnapshot assertion and no non-Latin literal in
    # src/ or tests/e2e/, and Latin plus emoji coverage ships on the image.
    #
    # The payload is a constant 21.1 MB, but its cost is set by whichever
    # azure.archive.ubuntu.com mirror the runner draws — observed fetch rates
    # span 90.8 MB/s down to 105 kB/s. Across the 14 jobs of runs 32204646202
    # and 32213236507 the step took 11.6s at best and 211.3s at worst, 163s of
    # it on the Burn-In job that gates Test Summary. Median 17.4s, so this
    # reads as cheap until the tail lands on the critical path.
    #
    # The cache-MISS path above is untouched: `install --with-deps` still
    # installs system dependencies when the browser cache is cold. If a future
    # runner image ever drops one of those libs, Chromium fails at launch on
    # every job, before any assertion runs — a loud failure, not a silent one.

name: 'Setup Supabase Local'
description: 'Install Supabase CLI, start local instance, apply migrations, and export credentials'

inputs:
  supabase-version:
    description: 'Supabase CLI version to install'
    required: false
    default: '2.77.1'

runs:
  using: 'composite'
  steps:
    - name: Setup Supabase CLI
      # Pinned to a commit, not a tag: `@v1` resolved to a mutable *branch* (supabase
      # never cut a floating `v1` tag), which is the unpinned-3rd-party-action risk
      # CodeQL flags. Kept in lockstep with the workflows, which dependabot moved to v3 —
      # dependabot only scans .github/workflows, so this file drifts unless bumped by hand.
      uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
      with:
        version: ${{ inputs.supabase-version }}

    - name: Start Supabase Local
      shell: bash
      run: |
        set -euo pipefail
        supabase start
        supabase status --output json | jq -e ".DB_URL" > /dev/null
        echo "Supabase Local started successfully"

    - name: Export Supabase credentials
      shell: bash
      run: |
        echo "SUPABASE_URL=$(supabase status --output json | jq -re '.API_URL')" >> $GITHUB_ENV
        echo "SUPABASE_ANON_KEY=$(supabase status --output json | jq -re '.ANON_KEY')" >> $GITHUB_ENV
        echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status --output json | jq -re '.SERVICE_ROLE_KEY')" >> $GITHUB_ENV
        # The Vite dev server Playwright boots reads the VITE_-prefixed names. Without
        # these, it falls back to .env.test's SUPABASE_TEST_ANON_KEY_PLACEHOLDER, which
        # Kong forwards verbatim and Realtime rejects with a 403 on the WebSocket
        # handshake — silently breaking every Realtime-dependent E2E spec while REST
        # calls keep succeeding on the bearer token. Vite's loadEnv gives process.env
        # priority over .env files, so these win.
        echo "VITE_SUPABASE_URL=$(supabase status --output json | jq -re '.API_URL')" >> $GITHUB_ENV
        echo "VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY=$(supabase status --output json | jq -re '.ANON_KEY')" >> $GITHUB_ENV
        echo "Supabase credentials exported"

    - name: Verify Supabase connectivity
      shell: bash
      run: |
        curl -sf "${SUPABASE_URL}/rest/v1/" -H "apikey: ${SUPABASE_ANON_KEY}" > /dev/null
        echo "Supabase API is reachable"

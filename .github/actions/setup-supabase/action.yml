name: 'Setup Supabase Local'
description: 'Install Supabase CLI, start local instance, apply migrations, and export credentials'

inputs:
  supabase-version:
    description: 'Supabase CLI version to install'
    required: false
    # At least 2.117.0, not 2.77.1: the CLI's bundled Realtime image is what serves the
    # REST broadcast endpoint `src/api/ephemeralBroadcast.ts:120` now sends on,
    # and that route landed in Realtime v2.97.0. 2.77.1 predates it, so every
    # `httpSend` in tests/api/couple-broadcast-authorization.spec.ts answered
    # `the endpoint returned 404` while the same specs passed locally against
    # the image 2.117.0 pulls (public.ecr.aws/supabase/realtime:v2.124.4).
    # Keep this at or above the CLI the suite is developed against; a CI pin
    # behind it silently tests a different Realtime than the app ships for.
    default: '2.118.0'
  needs-mail:
    description: >-
      Start the Mailpit catcher for jobs whose specs read a real auth email.
      Default false: only one job needs mail, and the exclusion list below is
      shared by ten, so making this opt-in keeps the other nine off the
      rate-limited pull path.
    required: false
    default: 'false'
  needs-edge-functions:
    description: >-
      Start the edge runtime for jobs whose specs call a Supabase Edge
      Function through Kong. Default false for the same reason as needs-mail:
      edge-runtime is the biggest single image pull and only one job needs it.
      Without it Kong answers 503 from a dead upstream rather than failing to
      start, so a spec that needs it fails on an assertion, not on setup.
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    # Replaces supabase/setup-cli, whose npm postinstall fetches the release
    # tarball with no cache, no retry and no timeout — that single download
    # produced the ECONNRESET failures on PRs #252 and #254 and a 15-minute
    # silent hang that timed out PR #262's Backend Tests (api) job. Cache the
    # binary keyed on the version, and make the cold-path download retried,
    # time-bounded and checksum-verified. Cache scoping means a new PR branch
    # takes the cold path once (it can only read caches from its own ref or
    # main), so a cold download on a fresh branch is normal, not a broken cache.
    # deploy.yml's migrate job and supabase-migrations.yml still use setup-cli,
    # pinned to this same version. package.json's supabase:up and supabase:down
    # run whatever `supabase` is on PATH (Homebrew), so bump all three pins
    # after `brew upgrade supabase`.
    - name: Cache Supabase CLI
      id: cli-cache
      uses: actions/cache@v6
      with:
        path: ~/.local/bin/supabase
        key: ${{ runner.os }}-${{ runner.arch }}-supabase-cli-${{ inputs.supabase-version }}

    - name: Install Supabase CLI
      if: steps.cli-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        ver="${{ inputs.supabase-version }}"
        base="https://github.com/supabase/cli/releases/download/v$ver"

        # The release layout is not stable across versions, so probe instead of
        # assuming. v2.77.1 publishes an UNversioned tarball
        # (supabase_linux_amd64.tar.gz) beside a VERSIONED checksums file
        # (supabase_2.77.1_checksums.txt); v2.117.0 inverts both -- versioned
        # tarball, plain checksums.txt -- and a hardcoded pair 404s on one
        # version or the other. The 404 is silent under -fsSL, so it surfaces
        # three jobs later as `supabase: command not found`.
        #
        # --max-time bounds a single attempt; --retry-max-time bounds the
        # whole retry loop. Without the latter, 5 retries of a hanging
        # endpoint could outlast the 15-minute job timeout this defends.
        dl() {
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 \
            --max-time "$2" --retry-max-time "$3" -o "$4" "$base/$1"
        }

        tarball=""
        for name in "supabase_${ver}_linux_amd64.tar.gz" "supabase_linux_amd64.tar.gz"; do
          if dl "$name" 60 180 /tmp/supabase_cli.tar.gz; then tarball="$name"; break; fi
        done
        if [ -z "$tarball" ]; then
          echo "::error::No linux_amd64 tarball found in supabase/cli release v$ver under either known name."
          exit 1
        fi

        sums=""
        for name in "checksums.txt" "supabase_${ver}_checksums.txt"; do
          if dl "$name" 20 60 /tmp/supabase_checksums.txt; then sums="$name"; break; fi
        done
        if [ -z "$sums" ]; then
          echo "::error::No checksums file found in supabase/cli release v$ver under either known name."
          exit 1
        fi

        # The checksums file names the asset exactly as published, so match on
        # the tarball name that actually downloaded, and fail loudly if that
        # name is absent rather than piping an empty list into sha256sum.
        if ! grep -q "  ${tarball}\$" /tmp/supabase_checksums.txt; then
          echo "::error::$sums does not list $tarball; refusing to install an unverified binary."
          exit 1
        fi
        cp /tmp/supabase_cli.tar.gz "/tmp/$tarball"
        (cd /tmp && grep "  ${tarball}\$" supabase_checksums.txt | sha256sum -c -)

        mkdir -p ~/.local/bin
        tar -xzf /tmp/supabase_cli.tar.gz -C ~/.local/bin supabase
        chmod +x ~/.local/bin/supabase

    - name: Add Supabase CLI to PATH
      shell: bash
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    # `-x` excludes up to five services. Three no CI job here touches; the other
    # two, mailpit and edge-runtime, are opt-in per job through needs-mail and
    # needs-edge-functions, so only the api leg starts them. Verified against the pinned
    # CLI source that the flag skips the PULL, not merely the container start:
    # internal/start/start.go:234 filters the excluded names out of the compose
    # project (`Services: utils.GetServices().Filter(notExcluded)`) BEFORE :236 pulls
    # it, and the other pull path (utils/docker.go DockerStart ->
    # DockerPullImageIfNotCached) sits behind `!isContainerExcluded(...)` at every
    # call site. The CLI's own test "skips excluded containers" asserts zero
    # unmatched image requests, which is the same claim from the other direction.
    #
    # This removes 36 of 118 blob requests — roughly a third of the pulled bytes —
    # from each of the 10 concurrent jobs. Deliberately no absolute MB figure here:
    # pkg/config/config.go replaceImageTag overrides the Dockerfile's pinned tags at
    # runtime (CI pulls gotrue v2.193.1 where the CLI pins v2.187.0), so any byte
    # total is a point-in-time measurement that drifts silently. The blob count is
    # stable because it follows the layer count, not the layer contents.
    #
    # All 11 images come from one rate-limited origin — utils/docker.go
    # GetRegistryImageUrl rewrites every image to public.ecr.aws — so 10 jobs x 36
    # fewer blobs is ~360 fewer requests per run against the same bucket. Those jobs
    # pull simultaneously and hit `toomanyrequests: Rate exceeded` 3-8 times per run;
    # in run 32268765187 it exhausted the retry ladder and killed Burn-In shard 2
    # before it ran a single test, reddening the sole required check.
    #
    # Why each name is safe to drop:
    #   imgproxy      pulled but never even started today — config.toml:120-121
    #                 leaves [storage.image_transformation] commented out, and the
    #                 run log already lists supabase_imgproxy_My-Love as stopped.
    #   studio        dev UI; nothing in src/ or tests/ references port 54323.
    #   postgres-meta studio's backend, gated SEPARATELY in the CLI, so excluding
    #                 studio alone would still pull this. Both names are required.
    #   mailpit       excluded for every job EXCEPT the one that passes
    #                 needs-mail: true. tests/api/pkce-code-exchange.spec.ts
    #                 starts a real PKCE flow with signInWithOtp and reads the
    #                 sign-in link back out of the catcher, so GoTrue has mail
    #                 to deliver there and the catcher must be up; config.toml
    #                 leaves [auth.email.smtp] commented out, so that container
    #                 is the only mail path. It stays excluded elsewhere because
    #                 the pull cost above is per-job and only Backend Tests (api)
    #                 reads mail. If that spec ever stops sending mail, drop the
    #                 input and put mailpit back on the unconditional list.
    #   edge-runtime  biggest single saving, now opt-in via needs-edge-functions
    #                 rather than unconditional. The warning this note used to
    #                 carry came true: tests/api/upload-love-note-image-limits.spec.ts
    #                 drives /functions/v1/upload-love-note-image, and with the
    #                 runtime excluded all six of its cases got 503 from a dead
    #                 Kong upstream instead of 200/413/415/401. Kong answers, so
    #                 the job fails on an assertion rather than on setup, which
    #                 reads like a product bug. Any new spec that calls an Edge
    #                 Function must set needs-edge-functions on its job.
    #
    # NOT excludable: postgres, plus kong/postgrest/gotrue/realtime/storage-api,
    # which the steps below and the suite depend on.
    #
    # CI-only. supabase/config.toml is untouched, so a local `supabase start` still
    # brings up Studio, Mailpit, pg-meta and edge functions exactly as before.
    #
    # The name guard is load-bearing: the CLI only PRINTS a warning for an
    # unrecognised -x name and carries on, so a rename upstream would silently
    # revert this to pulling all 11 images with nothing going red. Matching is
    # comma-delimited against the help text's own list rather than a substring
    # grep, because `postgres` is a substring of `postgres-meta` and would pass a
    # naive check while not being an excludable name at all.
    - name: Start Supabase Local
      shell: bash
      run: |
        set -euo pipefail
        # Rebuilt per job rather than hardcoded: mailpit is excluded unless the
        # caller asked for it, so nine of the ten jobs keep the saving.
        EXCLUDE='studio,postgres-meta,imgproxy'
        if [ "${{ inputs.needs-mail }}" != "true" ]; then
          EXCLUDE="$EXCLUDE,mailpit"
        fi
        if [ "${{ inputs.needs-edge-functions }}" != "true" ]; then
          EXCLUDE="$EXCLUDE,edge-runtime"
        fi

        # `|| true` so a non-zero `--help` reaches the -z branch below and reports
        # the annotated error, rather than `set -e` aborting the step with nothing
        # but a bare exit code. The version nag goes to stderr, so $( ) stays clean.
        VALID=$(supabase start --help 2>/dev/null | sed -n 's/.*--exclude.*\[\([^]]*\)\].*/\1/p') || true
        if [ -z "$VALID" ]; then
          echo "::error::Could not parse the -x name list from 'supabase start --help'."
          exit 1
        fi
        for svc in ${EXCLUDE//,/ }; do
          case ",$VALID," in
            *",$svc,"*) ;;
            *) echo "::error::'$svc' is not an excludable container in Supabase CLI ${{ inputs.supabase-version }} (valid: $VALID). The exclusion list would silently do nothing."; exit 1 ;;
          esac
        done

        # One retry. The CLI's internal ladder is 3 attempts ~12s apart in total,
        # which run 32268765187 exhausted attempt-for-attempt on gotrue. A second
        # outer attempt is cheap because `supabase stop` prunes containers, volumes
        # and networks but never images, so it re-pulls only what attempt 1 missed.
        # Capped at 2 attempts to stay inside db-tests' 10-minute job timeout.
        if ! supabase start -x "$EXCLUDE"; then
          echo "::warning::supabase start failed on attempt 1 — retrying once. Cached images are reused."
          supabase stop --no-backup || true
          sleep 30
          supabase start -x "$EXCLUDE"
        fi

        supabase status --output json | jq -e ".DB_URL" > /dev/null
        echo "Supabase Local started successfully"

    - name: Export Supabase credentials
      shell: bash
      run: |
        echo "SUPABASE_URL=$(supabase status --output json | jq -re '.API_URL')" >> $GITHUB_ENV
        echo "SUPABASE_ANON_KEY=$(supabase status --output json | jq -re '.ANON_KEY')" >> $GITHUB_ENV
        echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status --output json | jq -re '.SERVICE_ROLE_KEY')" >> $GITHUB_ENV
        # The Vite dev server Playwright boots reads the VITE_-prefixed names. Without
        # these, it falls back to .env.test's SUPABASE_TEST_ANON_KEY_PLACEHOLDER, which
        # Kong forwards verbatim and Realtime rejects with a 403 on the WebSocket
        # handshake — silently breaking every Realtime-dependent E2E spec while REST
        # calls keep succeeding on the bearer token. Vite's loadEnv gives process.env
        # priority over .env files, so these win.
        echo "VITE_SUPABASE_URL=$(supabase status --output json | jq -re '.API_URL')" >> $GITHUB_ENV
        echo "VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY=$(supabase status --output json | jq -re '.ANON_KEY')" >> $GITHUB_ENV
        echo "Supabase credentials exported"

    - name: Verify Supabase connectivity
      shell: bash
      run: |
        curl -sf "${SUPABASE_URL}/rest/v1/" -H "apikey: ${SUPABASE_ANON_KEY}" > /dev/null
        echo "Supabase API is reachable"

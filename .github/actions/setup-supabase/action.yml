name: 'Setup Supabase Local'
description: 'Install Supabase CLI, start local instance, apply migrations, and export credentials'

inputs:
  supabase-version:
    description: 'Supabase CLI version to install'
    required: false
    default: '2.77.1'

runs:
  using: 'composite'
  steps:
    # Replaces supabase/setup-cli, whose npm postinstall fetches the release
    # tarball with no cache, no retry and no timeout — that single download
    # produced the ECONNRESET failures on PRs #252 and #254 and a 15-minute
    # silent hang that timed out PR #262's Backend Tests (api) job. Cache the
    # binary keyed on the version, and make the cold-path download retried,
    # time-bounded and checksum-verified. Cache scoping means a new PR branch
    # takes the cold path once (it can only read caches from its own ref or
    # main), so a cold download on a fresh branch is normal, not a broken cache.
    # deploy.yml:32,80 and supabase-migrations.yml:22 still use setup-cli.
    - name: Cache Supabase CLI
      id: cli-cache
      uses: actions/cache@v5
      with:
        path: ~/.local/bin/supabase
        key: ${{ runner.os }}-${{ runner.arch }}-supabase-cli-${{ inputs.supabase-version }}

    - name: Install Supabase CLI
      if: steps.cli-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        base="https://github.com/supabase/cli/releases/download/v${{ inputs.supabase-version }}"
        # --max-time bounds a single attempt; --retry-max-time bounds the
        # whole retry loop. Without the latter, 5 retries of a hanging
        # endpoint could outlast the 15-minute job timeout this defends.
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 \
          --max-time 60 --retry-max-time 180 \
          -o /tmp/supabase_linux_amd64.tar.gz "$base/supabase_linux_amd64.tar.gz"
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 \
          --max-time 20 --retry-max-time 60 \
          -o /tmp/supabase_checksums.txt "$base/supabase_${{ inputs.supabase-version }}_checksums.txt"
        (cd /tmp && grep 'supabase_linux_amd64.tar.gz$' supabase_checksums.txt | sha256sum -c -)
        mkdir -p ~/.local/bin
        tar -xzf /tmp/supabase_linux_amd64.tar.gz -C ~/.local/bin supabase
        chmod +x ~/.local/bin/supabase

    - name: Add Supabase CLI to PATH
      shell: bash
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Start Supabase Local
      shell: bash
      run: |
        set -euo pipefail
        supabase start
        supabase status --output json | jq -e ".DB_URL" > /dev/null
        echo "Supabase Local started successfully"

    - name: Export Supabase credentials
      shell: bash
      run: |
        echo "SUPABASE_URL=$(supabase status --output json | jq -re '.API_URL')" >> $GITHUB_ENV
        echo "SUPABASE_ANON_KEY=$(supabase status --output json | jq -re '.ANON_KEY')" >> $GITHUB_ENV
        echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status --output json | jq -re '.SERVICE_ROLE_KEY')" >> $GITHUB_ENV
        # The Vite dev server Playwright boots reads the VITE_-prefixed names. Without
        # these, it falls back to .env.test's SUPABASE_TEST_ANON_KEY_PLACEHOLDER, which
        # Kong forwards verbatim and Realtime rejects with a 403 on the WebSocket
        # handshake — silently breaking every Realtime-dependent E2E spec while REST
        # calls keep succeeding on the bearer token. Vite's loadEnv gives process.env
        # priority over .env files, so these win.
        echo "VITE_SUPABASE_URL=$(supabase status --output json | jq -re '.API_URL')" >> $GITHUB_ENV
        echo "VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY=$(supabase status --output json | jq -re '.ANON_KEY')" >> $GITHUB_ENV
        echo "Supabase credentials exported"

    - name: Verify Supabase connectivity
      shell: bash
      run: |
        curl -sf "${SUPABASE_URL}/rest/v1/" -H "apikey: ${SUPABASE_ANON_KEY}" > /dev/null
        echo "Supabase API is reachable"

name: 'CodeQL Config'

# Exclude auto-generated, third-party, and non-standard runtime code from analysis
paths-ignore:
  - 'node_modules/**'
  - 'dist/**'
  - 'dist-ssr/**'
  - 'coverage/**'
  - '.nyc_output/**'
  - 'build/**'
  # Playwright/Vitest output can land at the repo root or under tests/ depending on
  # which config produced it, so these must be depth-independent globs. A root-relative
  # 'playwright-report/**' silently failed to match 'tests/playwright-report/**'.
  - '**/playwright-report/**'
  - '**/test-results/**'
  - '**/*.min.js'
  - '**/*.bundle.js'
  - 'public/mockServiceWorker.js'
  # Deno edge functions use CDN imports (https://esm.sh/) and Deno-specific globals
  # that CodeQL's TypeScript extractor cannot parse. Exclude to eliminate parse warnings.
  - 'supabase/functions/**'
  # Archived, non-executing E2E specs. Already excluded from tsc
  # (tsconfig.test.json / tsconfig.tsr.json) and from every Playwright project
  # (testDir is ./tests/e2e|api|integration); their relative imports no longer even
  # resolve. ESLint likewise disables no-unused-vars under tests/**. Retained only
  # as documentation — see tests/e2e-archive/README.md.
  - 'tests/e2e-archive/**'

queries:
  - uses: security-extended
  - uses: security-and-quality

# Exclude queries with high false positive rates in this codebase.
# js/xss-through-dom: flags <img src={blobUrl}> in React components; blob URLs from
# URL.createObjectURL() are not user-supplied HTML and cannot cause XSS.
query-filters:
  - exclude:
      id: js/xss-through-dom

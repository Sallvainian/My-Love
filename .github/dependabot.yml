# Dependabot configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'npm'
    groups:
      # Group minor and patch updates together
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'github-actions'
    ignore:
      # `v3` is an unreleased development branch of this action, not a release tag
      # (newest release is 2.10.0). Dependabot resolved the branch as a version and
      # bumped us onto it, which broke the Bundle Size check on every PR. Stay on v2
      # until a real v3 release exists.
      - dependency-name: 'preactjs/compressed-size-action'
        update-types: ['version-update:semver-major']
    groups:
      actions:
        patterns:
          - '*'
